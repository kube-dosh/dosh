        service: { type: string }
        port:
          type: string
          description: Backend Service port number or named port.
    IngressCreate:
      type: object
      required: [name, namespace, paths]
      properties:
        name: { type: string }
        namespace: { type: string }
        class: { type: string }
        paths:
          type: array

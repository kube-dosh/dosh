      tags: [storage]
      summary: Expand a PersistentVolumeClaim
      description: Capacity can only increase. The bound StorageClass and CSI driver must support expansion.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersistentVolumeClaimUpdate" }
      responses:
        "200":
          description: Updated PersistentVolumeClaim detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersistentVolumeClaimDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    delete:
      tags: [storage]
      summary: Delete a PersistentVolumeClaim
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
        - name: resourceVersion
          in: query
          schema: { type: string }
      responses:
        "202":
          description: PersistentVolumeClaim deletion accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/yaml:
    get:
      tags: [yaml]
      summary: Read YAML for an allow-listed resource
      parameters:
        - name: type
          in: query
          required: true
          schema: { $ref: "#/components/schemas/ResourceType" }
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: YAML resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YAMLResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/yaml/apply:
    post:
      tags: [yaml]
      summary: Validate with server-side dry run, then server-side apply
      description: >-
        Supports one allow-listed YAML document per request. The backend checks whether
        the target exists, then requires create for a new resource or update/patch for
        an existing resource before running Server-Side Apply.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml, dryRun]
              properties:
                yaml:
                  type: string
                  minLength: 1
                  description: Exactly one YAML document up to 1 MiB. Empty documents, multiple documents and duplicate keys are rejected before authorization or apply.
                resourceVersion: { type: string }
                dryRun: { type: boolean }
      responses:
        "200":
          description: Applied YAML returned by the API Server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YAMLResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
        "501": { $ref: "#/components/responses/NotSupported" }
  /api/v1/resources/discovery:
    get:
      tags: [resources]
      summary: Read the discoverable Kubernetes resource catalog
      description: >-
        Returns resources found through Kubernetes API Discovery, including every
        served API version. Each descriptor marks whether its version is preferred
        by the API server. The catalog is cached by the server. When `namespace` is
        supplied, the catalog is also filtered with SelfSubjectRulesReview for the
        authenticated user so types without list permission are hidden.
        Resource-level reads still require Kubernetes RBAC authorization.
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Discovered resource types
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceDiscovery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/resources/search:
    get:
      tags: [resources]
      summary: Search a bounded set of authorized Kubernetes resource types
      description: >-
        Searches up to 24 discovered resource types that the authenticated user
        may list. A concrete namespace limits the search to that namespace.
        `namespace=all` enumerates up to 8 visible namespaces and performs a
        fail-closed SelfSubjectRulesReview for each namespace. An omitted
        namespace searches cluster-scoped resources only. Results, namespaces
        and type/scope combinations are bounded and emit truncation warnings.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Namespace"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Bounded cross-type search result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResourceSearch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/resources/capabilities:
    get:
      tags: [resources]
      summary: Get current-user write capabilities for one discovered resource type
      description: >-
        Evaluates create, update/patch and delete access for the authenticated
        user in the selected namespace. Secret generic create and update remain
        disabled because the dedicated Secret workflow owns those writes.
      parameters:
        - name: group
          in: query
          required: true
          schema: { type: string }
          description: Use an empty value or `_core` for the core API group.
        - name: version
          in: query
          required: true
          schema: { type: string }
        - name: resource
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Current-user resource capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceCapabilities" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/resources/schema:
    get:
      tags: [resources]
      summary: Read the advisory OpenAPI schema for one discovered resource type
      description: >-
        Resolves the cluster OpenAPI v2 definition for one discovered GVR and
        returns only the root schema and recursively referenced definitions.
        Schemas are cached by the server. When OpenAPI discovery is unavailable
        or the definition is missing, the response uses `source=unavailable` and
        includes warnings so clients can fall back to YAML editing. Kubernetes
        API Server dry-run remains the authoritative write validator.
      parameters:
        - name: group
          in: query
          required: true
          schema: { type: string }
          description: Use an empty value or `_core` for the core API group.
        - name: version
          in: query
          required: true
          schema: { type: string }
        - name: resource
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Advisory resource schema
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceSchema" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/resources/{group}/{version}/{resource}:
    get:
      tags: [resources]
      summary: List one discovered Kubernetes resource type
      description: >-
        Uses API Discovery to validate the resource type, then requires list
        permission for the authenticated user before reading Kubernetes objects.
        Use `_core` for the core API group.
      parameters:
        - $ref: "#/components/parameters/ResourceGroupPath"
        - $ref: "#/components/parameters/ResourceVersionPath"
        - $ref: "#/components/parameters/ResourceNamePath"
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: Generic resource metadata list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResourceList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    post:
      tags: [resources]
      summary: Create one discovered Kubernetes resource from YAML
      description: >-
        Validates one YAML document and its discovered GVR before authorization.
        A real create always performs an internal API Server dry run first.
        Generic Secret creation is disabled; use the dedicated Secret editor.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ResourceGroupPath"
        - $ref: "#/components/parameters/ResourceVersionPath"
        - $ref: "#/components/parameters/ResourceNamePath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenericResourceMutation" }
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResourceDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/resources/{group}/{version}/{resource}/{name}:
    get:
      tags: [resources]
      summary: Read one discovered Kubernetes resource
      description: >-
        Returns the API object and YAML for a discovered resource. Secret data is
        redacted in this generic view; use the Secret-specific reveal workflow for
        audited sensitive access.
      parameters:
        - $ref: "#/components/parameters/ResourceGroupPath"
        - $ref: "#/components/parameters/ResourceVersionPath"
        - $ref: "#/components/parameters/ResourceNamePath"
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Generic resource detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResourceDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    put:
      tags: [resources]
      summary: Update one discovered Kubernetes resource from YAML
      description: >-
        Requires update or patch access. A real update always performs an
        internal API Server dry run first. Generic Secret updates are disabled.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ResourceGroupPath"
        - $ref: "#/components/parameters/ResourceVersionPath"
        - $ref: "#/components/parameters/ResourceNamePath"
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Namespace"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenericResourceMutation" }
      responses:
        "200":
          description: Resource updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResourceDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    delete:
      tags: [resources]
      summary: Delete one discovered Kubernetes resource
      description: >-
        Deletes through the discovered GVR after delete authorization. A caller
        supplied resourceVersion is used as a Kubernetes precondition.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ResourceGroupPath"
        - $ref: "#/components/parameters/ResourceVersionPath"
        - $ref: "#/components/parameters/ResourceNamePath"
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Namespace"
        - name: resourceVersion
          in: query
          schema: { type: string }
        - name: propagation
          in: query
          schema:
            type: string
            enum: [Background, Foreground, Orphan]
            default: Background
        - name: confirmation
          in: query
          schema: { type: string }
          description: Required for critical/high-risk resource deletion; must equal the resource name.
      responses:
        "202":
          description: Deletion accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/resources/{group}/{version}/{resource}/{name}/relations:
    get:
      tags: [resources]
      summary: Read bounded direct relationships for one discovered resource
      description: >-
        Returns immediate owners, managed Pods, Services, Ingresses, nodes and
        storage relationships. Related-type list failures degrade to warnings.
        At most 40 edges are returned.
      parameters:
        - { $ref: "#/components/parameters/ResourceGroupPath" }
        - { $ref: "#/components/parameters/ResourceVersionPath" }
        - { $ref: "#/components/parameters/ResourceNamePath" }
        - { $ref: "#/components/parameters/Name" }
        - { $ref: "#/components/parameters/Namespace" }
      responses:
        "200":
          description: Direct resource relationships
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceRelations" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dosh_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Namespace:
      name: namespace
      in: query
      schema: { type: string }
    NamespacePath:
      name: namespace
      in: path
      required: true
      schema: { type: string }
    Search:
      name: q
      in: query
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200 }
    Cursor:
      name: cursor
      in: query
      description: Opaque continuation cursor returned in meta.nextCursor. Use it for the next page; do not construct or modify it.
      schema: { type: string, maxLength: 8192 }
    Sort:
      name: sort
      in: query
      description: Resource-specific sort field. Unsupported fields return 400.
      schema: { type: string }
    Order:
      name: order
      in: query
      description: Sort direction; requires sort.
      schema: { type: string, enum: [asc, desc], default: asc }
    ObjectKind:
      name: objectKind
      in: query
      description: Case-insensitive involved object kind filter for events.
      schema: { type: string }
    ObjectName:
      name: objectName
      in: query
      description: Involved object name filter for events.
      schema: { type: string }
    Kind:
      name: kind
      in: query
      schema: { $ref: "#/components/schemas/WorkloadKind" }
    WorkloadStatus:
      name: status
      in: query
      description: Case-insensitive workload status filter.
      schema: { type: string }
    KindPath:
      name: kind
      in: path
      required: true
      schema: { $ref: "#/components/schemas/WorkloadKind" }
    Name:
      name: name
      in: path
      required: true
      schema: { type: string }
    ResourceGroupPath:
      name: group
      in: path
      required: true
      description: Kubernetes API group, or `_core` for the core API group.
      schema: { type: string }
    ResourceVersionPath:
      name: version
      in: path
      required: true
      schema: { type: string }
    ResourceNamePath:
      name: resource
      in: path
      required: true
      description: Plural Kubernetes resource name, for example `pods` or `prometheuses`.
      schema: { type: string }
  responses:
    Session:
      description: Authenticated session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Permission or read-only mode denied the operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Resource version conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Login rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    DependencyUnavailable:
      description: Kubernetes API unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotSupported:
      description: Operation not supported for this resource kind
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
    ListMeta:
      type: object
      required: [total, totalKnown, page, pageSize, totalPages, hasMore]
      properties:
        total: { type: integer, minimum: 0 }
        totalKnown:
          type: boolean
          description: True when total is exact. False means the count is a lower bound for a filtered cursor scan.
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalPages: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.
        truncated:
          type: boolean
          description: True when a bounded event window or scan cap limited the result set.
        warnings:
          type: array
          items: { type: string }
        sort: { type: string }
        order: { type: string, enum: [asc, desc] }
        filters:
          type: object
          additionalProperties: { type: string }
        namespace: { type: string }
        search: { type: string }
        kind: { type: string }
        status: { type: string }
        columns:
          type: array
          description: Table API column definitions for type-aware generic resource lists.
          items: { $ref: "#/components/schemas/ResourceColumn" }
    OperationStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Actor:
      type: object
      required: [username, admin]
      properties:
        username: { type: string }
        groups:
          type: array
          items: { type: string }
        admin: { type: boolean }
    Capabilities:
      type: object
      required: [read, scale, restart, updateImage, suspendCronJob, delete, create, createService, updateService, deleteService, deleteNamespace, revealSecrets, editYAML, nodeCordon, nodeDrain, podExec, podEphemeralDebug, podPortForward, helmReleases, helmUpgrade, reloadCertificate]
      properties:
        read: { type: boolean }
        scale: { type: boolean }
        restart: { type: boolean }
        updateImage: { type: boolean }
        suspendCronJob: { type: boolean }
        delete: { type: boolean }
        create: { type: boolean }
        createService: { type: boolean }
        updateService: { type: boolean }
        deleteService: { type: boolean }
        deleteNamespace: { type: boolean }
        revealSecrets: { type: boolean }
        editYAML: { type: boolean }
        nodeCordon: { type: boolean }
        nodeDrain: { type: boolean }
        podExec: { type: boolean }
        podEphemeralDebug: { type: boolean }
        podPortForward: { type: boolean }
        helmReleases: { type: boolean }
        helmUpgrade: { type: boolean }
        reloadCertificate: { type: boolean }
        resourceActions:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ResourceCapabilities" }
    AccessReview:
      type: object
      required: [allowed, verb, resource, reason, guidance, kubectlCommand]
      properties:
        allowed: { type: boolean }
        verb: { type: string }
        apiGroup: { type: string }
        resource: { type: string }
        subresource: { type: string }
        namespace: { type: string }
        name: { type: string }
        reason: { type: string, enum: [allowed, read_only, rbac_denied, authorization_unavailable] }
        guidance: { type: string }
        kubectlCommand: { type: string }
    ResourceCapabilities:
      type: object
      required: [create, update, delete, scale]
      properties:
        create: { type: boolean }
        update: { type: boolean }
        delete: { type: boolean }
        scale: { type: boolean }
        riskLevel: { type: string, enum: [normal, high, critical] }
        riskReasons:
          type: array
          items: { type: string }
        requireConfirmation:
          type: boolean
          description: When true, real writes and deletes must include the resource name as confirmation.
    ServerCertificate:
      type: object
      required: [mode, enabled, configured, status, dnsNames, ipAddresses, daysRemaining, autoReload, reloadIntervalSeconds]
      properties:
        mode: { type: string, enum: [https, http] }
        enabled: { type: boolean }
        configured: { type: boolean }
        status: { type: string, enum: [valid, expiring, expired, not_yet_valid, disabled, unavailable] }
        subject: { type: string }
        issuer: { type: string }
        serialNumber: { type: string }
        dnsNames:
          type: array
          items: { type: string }
        ipAddresses:
          type: array
          items: { type: string }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        daysRemaining: { type: integer }
        fingerprintSha256: { type: string }
        keyAlgorithm: { type: string }
        autoReload: { type: boolean }
        reloadIntervalSeconds: { type: integer, minimum: 0 }
        lastReloadedAt: { type: string, format: date-time }
        lastReloadError: { type: string }
    Session:
      type: object
      required: [user, csrfToken, expiresAt, capabilities, authMode]
      properties:
        user: { $ref: "#/components/schemas/Actor" }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        authMode: { type: string, enum: [local, oidc, token] }
    AuthConfig:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [local, oidc, token] }
        providerName: { type: string }
    Condition:
      type: object
      required: [type, status]
      properties:
        type: { type: string }
        status: { type: string }
        reason: { type: string }
        message: { type: string }
        lastTransitionTime: { type: string, format: date-time }
    Event:
      type: object
      required: [uid, namespace, type, reason, message, objectKind, objectName, count, firstSeen, lastSeen]
      properties:
        uid: { type: string }
        namespace: { type: string }
        type: { type: string }
        reason: { type: string }
        message: { type: string }
        objectKind: { type: string }
        objectName: { type: string }
        count: { type: integer }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        source: { type: string }
    AuditRecord:

      tags: [resilience]
      summary: List HorizontalPodAutoscalers with scaling status and metric explanations
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Autoscalers visible to the current identity
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AutoscalerSummary" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    post:
      tags: [resilience]
      summary: Create a CPU or memory HorizontalPodAutoscaler after API Server dry-run

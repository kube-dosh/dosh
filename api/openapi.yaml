      tags: [yaml]
      summary: Read YAML for an allow-listed resource
      parameters:
        - name: type
          in: query
          required: true
          schema: { $ref: "#/components/schemas/ResourceType" }
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: YAML resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YAMLResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/yaml/apply:
    post:
      tags: [yaml]
      summary: Validate with server-side dry run, then server-side apply
      description: >-
        Supports one allow-listed YAML document per request. The backend checks whether
        the target exists, then requires create for a new resource or update/patch for
        an existing resource before running Server-Side Apply.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml, dryRun]
              properties:
                yaml:
                  type: string
                  minLength: 1
                  description: Exactly one YAML document up to 1 MiB. Empty documents, multiple documents and duplicate keys are rejected before authorization or apply.
                resourceVersion: { type: string }
                dryRun: { type: boolean }
      responses:
        "200":
          description: Applied YAML returned by the API Server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YAMLResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
        "501": { $ref: "#/components/responses/NotSupported" }
  /api/v1/resources/discovery:
    get:
      tags: [resources]
      summary: Read the discoverable Kubernetes resource catalog
      description: >-
        Returns resources found through Kubernetes API Discovery, including every
        served API version. Each descriptor marks whether its version is preferred
        by the API server. The catalog is cached by the server. When `namespace` is
        supplied, the catalog is also filtered with SelfSubjectRulesReview for the
        authenticated user so types without list permission are hidden.
        Resource-level reads still require Kubernetes RBAC authorization.
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Discovered resource types
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceDiscovery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/resources/search:
    get:
      tags: [resources]
      summary: Search a bounded set of authorized Kubernetes resource types
      description: >-
        Searches up to 24 discovered resource types that the authenticated user
        may list. A concrete namespace limits the search to that namespace.
        `namespace=all` enumerates up to 8 visible namespaces and performs a
        fail-closed SelfSubjectRulesReview for each namespace. An omitted
        namespace searches cluster-scoped resources only. Results, namespaces
        and type/scope combinations are bounded and emit truncation warnings.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Namespace"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Bounded cross-type search result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResourceSearch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/resources/capabilities:
    get:
      tags: [resources]
      summary: Get current-user write capabilities for one discovered resource type
      description: >-
        Evaluates create, update/patch and delete access for the authenticated
        user in the selected namespace. Secret generic create and update remain
        disabled because the dedicated Secret workflow owns those writes.
      parameters:
        - name: group
          in: query
          required: true
          schema: { type: string }
          description: Use an empty value or `_core` for the core API group.
        - name: version
          in: query
          required: true
          schema: { type: string }
        - name: resource
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Current-user resource capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceCapabilities" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/resources/schema:
    get:
      tags: [resources]
      summary: Read the advisory OpenAPI schema for one discovered resource type
      description: >-
        Resolves the cluster OpenAPI v2 definition for one discovered GVR and
        returns only the root schema and recursively referenced definitions.
        Schemas are cached by the server. When OpenAPI discovery is unavailable
        or the definition is missing, the response uses `source=unavailable` and
        includes warnings so clients can fall back to YAML editing. Kubernetes
        API Server dry-run remains the authoritative write validator.
      parameters:
        - name: group
          in: query
          required: true
          schema: { type: string }
          description: Use an empty value or `_core` for the core API group.
        - name: version
          in: query
          required: true
          schema: { type: string }
        - name: resource
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Advisory resource schema
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceSchema" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/resources/{group}/{version}/{resource}:
    get:
      tags: [resources]
      summary: List one discovered Kubernetes resource type
      description: >-
        Uses API Discovery to validate the resource type, then requires list
        permission for the authenticated user before reading Kubernetes objects.
        Use `_core` for the core API group.
      parameters:
        - $ref: "#/components/parameters/ResourceGroupPath"
        - $ref: "#/components/parameters/ResourceVersionPath"
        - $ref: "#/components/parameters/ResourceNamePath"
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: Generic resource metadata list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResourceList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    post:
      tags: [resources]
      summary: Create one discovered Kubernetes resource from YAML
      description: >-
        Validates one YAML document and its discovered GVR before authorization.
        A real create always performs an internal API Server dry run first.
        Generic Secret creation is disabled; use the dedicated Secret editor.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ResourceGroupPath"
        - $ref: "#/components/parameters/ResourceVersionPath"
        - $ref: "#/components/parameters/ResourceNamePath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenericResourceMutation" }
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResourceDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/resources/{group}/{version}/{resource}/{name}:
    get:
      tags: [resources]
      summary: Read one discovered Kubernetes resource
      description: >-
        Returns the API object and YAML for a discovered resource. Secret data is
        redacted in this generic view; use the Secret-specific reveal workflow for
        audited sensitive access.
      parameters:
        - $ref: "#/components/parameters/ResourceGroupPath"
        - $ref: "#/components/parameters/ResourceVersionPath"
        - $ref: "#/components/parameters/ResourceNamePath"
        - $ref: "#/components/parameters/Name"

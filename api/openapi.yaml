        savedViews:
          type: object
          additionalProperties:
            type: array
            maxItems: 12
            items: { $ref: "#/components/schemas/SavedResourceViewPreference" }
        hiddenColumns:
          type: object
          additionalProperties:
            type: array
            maxItems: 64
            items: { type: string }

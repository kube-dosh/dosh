      type: object
      required: [apiVersion, kind, name, object, yaml]
      properties:
        apiVersion: { type: string }
        kind: { type: string }
        name: { type: string }
        namespace: { type: string }
        uid: { type: string }
        resourceVersion: { type: string }
        createdAt: { type: string, format: date-time }
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        object:
          type: object
          additionalProperties: true
        yaml: { type: string }
        redacted: { type: boolean }
        warnings:
          type: array
          items: { type: string }
    ResourceRelations:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ResourceRelation" }
        warnings:
          type: array
          items: { type: string }
    ResourceRelation:
      type: object
      required: [apiVersion, kind, name, relationship, direction]
      properties:
        apiVersion: { type: string }
        kind: { type: string }
        resource: { type: string }
        name: { type: string }
        namespace: { type: string }
        relationship: { type: string }
        direction: { type: string, enum: [upstream, downstream, related] }
        status: { type: string }
    GenericResourceMutation:
      type: object
      required: [yaml]
      properties:
        namespace:
          type: string
          description: Selected namespace. Must agree with metadata.namespace for namespaced resources.
        yaml:
          type: string
          minLength: 1
          description: Exactly one YAML document up to 1 MiB with a matching apiVersion, kind and metadata.name.
        resourceVersion: { type: string }
        dryRun:
          type: boolean
          default: false
          description: When true, validates without writing. Real writes still perform an internal dry run first.
        confirmation:
          type: string
          description: Required for critical/high-risk real writes; must equal metadata.name.

openapi: 3.1.0
info:
  title: Dosh Kubernetes Operations API
  version: 0.1.8
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: |
    Same-origin API consumed by the Dosh embedded React console. Session cookies
    are HttpOnly and every mutating request must include the session CSRF token.
    Kubernetes objects are translated into stable DTOs; arbitrary Kubernetes API
    proxying is intentionally not supported.
servers:
  - url: /
tags:
  - name: auth
  - name: cluster
  - name: workloads
  - name: observability
  - name: network
  - name: configuration
  - name: certificates
  - name: storage
  - name: yaml
  - name: resources
  - name: preferences
  - name: registries
  - name: diagnostics
  - name: resilience
  - name: system
security:
  - cookieAuth: []
paths:
  /api/v1/session:
    get:
      tags: [auth]
      summary: Read the current session
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [auth]
      summary: Authenticate with local credentials or a Kubernetes bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: Local administrator credentials
                  required: [username, password]
                  properties:
                    username: { type: string, minLength: 1 }
                    password: { type: string, minLength: 1, format: password }
                - type: object
                  description: Kubernetes bearer token validated with TokenReview
                  required: [token]
                  properties:
                    token: { type: string, minLength: 1, maxLength: 16384 }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [auth]
      summary: Clear the current session cookie
      responses:
        "204": { description: Session cleared }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/preferences:
    get:
      tags: [preferences]
      summary: Read bounded UI preferences synchronized for the current user
      description: Contains only favorites, recent resources, saved views and hidden columns. No Secret values or command output are stored.
      responses:
        "200":
          description: Current user preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    put:
      tags: [preferences]
      summary: Replace bounded UI preferences for the current user
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPreferences" }
      responses:
        "200":
          description: Saved user preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/capabilities:
    get:
      tags: [auth]
      summary: Read current user capabilities
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Capability flags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/container-registries:
    get:
      tags: [registries]
      summary: List configured container registries
      responses:
        "200":
          description: Container registry metadata without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    post:
      tags: [registries]
      summary: Add a container registry
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContainerRegistryUpsert" }
      responses:
        "201":
          description: Container registry created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/container-registries/resolve:
    get:
      tags: [registries]
      summary: Resolve an image reference to a configured registry
      parameters:
        - { name: image, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 512 } }
      responses:
        "200":
          description: Image resolution, including whether the registry is configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageReferenceResolution" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/container-registries/{id}:
    put:
      tags: [registries]
      summary: Update a container registry
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContainerRegistryUpsert" }
      responses:
        "200":
          description: Container registry updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    delete:
      tags: [registries]
      summary: Delete a container registry
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 128 } }
        - { name: revision, in: query, schema: { type: string, maxLength: 256 } }
      responses:
        "200":
          description: Container registry deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/container-registries/{id}/test:
    post:
      tags: [registries]
      summary: Test registry connectivity and record capabilities
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: Registry with the recorded test result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/container-registries/{id}/repositories:
    get:
      tags: [registries]
      summary: Search repositories exposed by a registry catalog
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 128 } }
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Matching repositories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistryRepositoryList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/container-registries/{id}/tags:
    get:
      tags: [registries]
      summary: Search tags for one registry repository
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 128 } }
        - { name: repository, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 512 } }
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Matching tags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistryTagList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/capabilities/review:
    get:
      tags: [auth]
      summary: Explain one SubjectAccessReview decision for the current identity
      parameters:
        - { name: verb, in: query, required: true, schema: { type: string, maxLength: 253 } }
        - { name: apiGroup, in: query, schema: { type: string, maxLength: 253 } }
        - { name: resource, in: query, required: true, schema: { type: string, maxLength: 253 } }
        - { name: subresource, in: query, schema: { type: string, maxLength: 253 } }
        - { name: namespace, in: query, schema: { type: string, maxLength: 253 } }
        - { name: name, in: query, schema: { type: string, maxLength: 253 } }
      responses:
        "200":
          description: Authorization decision and remediation guidance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/config:
    get:
      tags: [auth]
      summary: Read public authentication mode
      security: []
      responses:
        "200":
          description: Authentication configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /api/v1/auth/oidc/login:
    get:
      tags: [auth]
      summary: Start OIDC Authorization Code with PKCE
      security: []
      parameters:
        - name: returnTo
          in: query
          schema: { type: string }
      responses:
        "302": { description: Redirect to the OIDC provider }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/oidc/callback:
    get:
      tags: [auth]
      summary: Complete OIDC Authorization Code flow
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to the validated return path or login error }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/oidc/logout:
    get:
      tags: [auth]
      summary: Clear the session and perform RP-initiated logout when supported
      responses:
        "302": { description: Redirect to the provider or local login page }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/overview:
    get:
      tags: [cluster]
      summary: Aggregate cluster overview
      responses:
        "200":
          description: Cluster overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/cluster/config:
    get:
      tags: [cluster]
      summary: Read non-secret cluster identity and network configuration
      responses:
        "200":
          description: Cluster configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterConfiguration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/nodes:
    get:
      tags: [cluster]
      summary: List nodes
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Order" }
      responses:
        "200":
          description: Node list
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/NodeSummary" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/nodes/{name}:
    get:
      tags: [cluster]
      summary: Get node detail, conditions, taints and pods
      parameters:
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Node detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/nodes/{name}/cordon:
    post:
      tags: [cluster]
      summary: Mark a node unschedulable without evicting existing pods
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Updated node summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/nodes/{name}/uncordon:
    post:
      tags: [cluster]
      summary: Restore scheduling on a cordoned node
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Updated node summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/nodes/{name}/drain-plan:
    get:
      tags: [cluster]
      summary: Preview Pod eviction, PDBs and skip reasons before draining a node
      parameters:
        - { $ref: "#/components/parameters/Name" }
        - name: ignoreDaemonSets
          in: query
          schema: { type: boolean, default: false }
        - name: force
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Non-mutating drain plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeDrainPlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/nodes/{name}/drain:
    post:
      tags: [cluster]
      summary: Cordon a node and evict eligible Pods with PDB safety checks
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeDrainOptions" }
      responses:
        "200":
          description: Drain result, including blocked or remaining Pods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeDrainResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/nodes/{name}/labels:
    put:
      tags: [cluster]
      summary: Replace node labels using the loaded resource version
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeLabelUpdate" }
      responses:
        "200":
          description: Updated node detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/nodes/{name}/taints:
    put:
      tags: [cluster]
      summary: Replace node taints using the loaded resource version
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeTaintUpdate" }
      responses:
        "200":
          description: Updated node detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/namespaces:
    get:
      tags: [cluster]
      summary: List namespaces
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Order" }
      responses:
        "200":
          description: Namespace list
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Namespace" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [cluster]
      summary: Create a namespace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NamespaceCreate" }
      responses:
        "201":
          description: Namespace created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Namespace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/namespaces/{name}:
    get:
      tags: [cluster]
      summary: Get namespace detail
      parameters:
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Namespace detail with resource quotas and limit ranges
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NamespaceDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [cluster]
      summary: Delete a namespace and all resources it contains
      description: |
        Deletes the namespace with foreground cascading deletion. The default and
        kube-* system namespaces are protected. Supplying resourceVersion enables
        an optimistic-concurrency precondition.
      parameters:
        - { $ref: "#/components/parameters/Name" }
        - name: resourceVersion
          in: query
          schema: { type: string }
      responses:
        "202":
          description: Namespace deletion accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/workloads:
    get:
      tags: [workloads]
      summary: List supported workload kinds
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Kind" }
        - { $ref: "#/components/parameters/WorkloadStatus" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Order" }
      responses:
        "200":
          description: Workload list
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WorkloadSummary" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/workloads/deployments:
    post:
      tags: [workloads]
      summary: Validate with API Server dry-run and create a Deployment
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
              schema: { $ref: "#/components/schemas/WorkloadCreateRequest" }
      responses:
        "201":
          description: Deployment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/workloads/deployments/preview:
    post:
      tags: [workloads]
      summary: Preview the validated Deployment manifest without writing
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
              schema: { $ref: "#/components/schemas/WorkloadCreateRequest" }
      responses:
        "200":
          description: Deployment manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/workloads/create:
    post:
      tags: [workloads]
      summary: Validate with API Server dry-run and create a workload
      description: Creates one Deployment, StatefulSet, DaemonSet, Job or CronJob with one or more application containers and optional init containers. The request is validated locally, then submitted once with API Server dry-run before the real create request.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkloadCreateKindRequest" }
      responses:
        "201":
          description: Workload created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/workloads/create/preview:
    post:
      tags: [workloads]
      summary: Preview a validated workload manifest without writing
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkloadCreateKindRequest" }
      responses:
        "200":
          description: Workload manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/workloads/cronjob/{namespace}/{name}/run:
    post:
      tags: [workloads]
      summary: Create a one-off Job from a CronJob template
      description: Requires get on the CronJob and create on Jobs. The CronJob schedule is not modified.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CronJobRunRequest" }
      responses:
        "201":
          description: Job created from the CronJob template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/workloads/{kind}/{namespace}/{name}:
    get:
      tags: [workloads]
      summary: Get workload detail and owned pods
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Workload detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotSupported" }
    delete:
      tags: [workloads]
      summary: Delete a workload
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
        - name: propagation
          in: query
          schema:
            type: string
            enum: [Background, Foreground, Orphan]
            default: Background
      responses:
        "202":
          description: Deletion accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/workloads/{kind}/{namespace}/{name}/scale:
    post:
      tags: [workloads]
      summary: Scale a Deployment or StatefulSet
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replicas]
              properties:
                replicas: { type: integer, minimum: 0, maximum: 1000 }
                resourceVersion: { type: string }
      responses:
        "200":
          description: Scale accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
  /api/v1/workloads/{kind}/{namespace}/{name}/restart:
    post:
      tags: [workloads]
      summary: Trigger a rolling restart
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Restart accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotSupported" }
  /api/v1/workloads/{kind}/{namespace}/{name}/image:
    post:
      tags: [workloads]
      summary: Update one container image in a Deployment, StatefulSet or DaemonSet
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [containerName, image]
              properties:
                containerName: { type: string, minLength: 1, maxLength: 63 }
                image: { type: string, minLength: 1, maxLength: 512 }
                registryId: { type: string, maxLength: 128 }
                resourceVersion: { type: string, maxLength: 256 }
      responses:
        "200":
          description: Image update accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/workloads/{kind}/{namespace}/{name}/containers/{container}/config:
    put:
      tags: [workloads]
      summary: Update environment, volume mounts and health probes for one container
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
        - name: container
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 63 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkloadContainerConfigUpdate" }
      responses:
        "200":
          description: Container configuration updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/workloads/{kind}/{namespace}/{name}/suspend:
    post:
      tags: [workloads]
      summary: Pause or resume future scheduling for a CronJob
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspend]
              properties:
                suspend: { type: boolean }
                resourceVersion: { type: string, maxLength: 256 }
      responses:
        "200":
          description: CronJob scheduling state updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/workloads/{kind}/{namespace}/{name}/rollout:
    post:
      tags: [workloads]
      summary: Pause, resume or tune a Deployment rolling update
      description: Only Deployments are supported. Values may be integers or percentages.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkloadRolloutUpdate" }
      responses:
        "200":
          description: Rollout settings updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/workloads/{kind}/{namespace}/{name}/revisions:
    get:
      tags: [workloads]
      summary: List retained Deployment or StatefulSet revisions
      description: >-
        Deployment revisions are derived from owned ReplicaSets. StatefulSet
        revisions are derived from owned ControllerRevisions. Revisions are
        ordered newest first and never expose manifest content in this view.
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Retained workload revisions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WorkloadRevision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/workloads/{kind}/{namespace}/{name}/rollback:
    post:
      tags: [workloads]
      summary: Roll a Deployment or StatefulSet back to one retained revision
      description: >-
        Uses a targeted merge patch to restore the retained pod template and
        change-cause annotation while preserving the current replica count,
        status, and other concurrent changes outside the pod template.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
      responses:
        "202":
          description: Rollback accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/pods:
    get:
      tags: [workloads]
      summary: List pods
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Order" }
      responses:
        "200":
          description: Pod list
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PodSummary" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/pods/{namespace}/{name}:
    get:
      tags: [workloads]
      summary: Get pod detail
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Pod detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PodDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [workloads]
      summary: Delete a Pod
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      responses:
        "202":
          description: Pod deletion accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/pods/{namespace}/{name}/tunnels:
    post:
      tags: [workloads]
      summary: Open a short-lived browser tunnel to one Pod port
      description: >-
        Requires `create pods/portforward`. The server opens a loopback-only
        SPDY port-forward and returns an unguessable same-origin tunnel path.
        The client never supplies an upstream address or Kubernetes port-forward
        URL. Sessions are user-bound and expire automatically.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortForwardRequest" }
      responses:
        "201":
          description: Port-forward session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortForwardSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/pods/{namespace}/{name}/ephemeral-containers:
    post:
      tags: [workloads]
      summary: Create an audited Ephemeral Container for Pod debugging
      description: |
        Requires `update pods/ephemeralcontainers` through SubjectAccessReview.
        The container name is generated by the server and the command is limited
        to an allow-listed shell that keeps the debug container alive for exec.
        The image must contain the selected shell. Ephemeral containers remain
        until the Pod is deleted; cluster admission policy remains authoritative.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PodEphemeralContainerCreate" }
      responses:
        "201":
          description: Created ephemeral container
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PodEphemeralContainerResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/pods/{namespace}/{name}/logs:
    get:
      tags: [observability]
      summary: Stream pod container logs as bounded NDJSON frames
      description: |
        Streams newline-delimited JSON frames. A `log` frame carries one UTF-8
        log chunk. A clean EOF terminates with an `end` frame. A stream failure
        after headers are sent terminates with an `error` frame containing a
        stable code, safe message and request ID. Errors detected before the
        stream starts use the normal JSON Problem response.
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
        - name: container
          in: query
          schema: { type: string }
        - name: follow
          in: query
          schema: { type: boolean, default: false }
        - name: tailLines
          in: query
          schema: { type: integer, minimum: 0, maximum: 5000, default: 200 }
        - name: timestamps
          in: query
          schema: { type: boolean, default: false }
        - name: previous
          in: query
          description: Read logs from the previous terminated container instance.
          schema: { type: boolean, default: false }
        - name: sinceSeconds
          in: query
          description: Only return logs newer than this many seconds. Capped at seven days.
          schema: { type: integer, minimum: 0, maximum: 604800 }
      responses:
        "200":
          description: NDJSON log stream (`log`, `end` or terminal `error` frames)
          content:
            application/x-ndjson:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/workloads/{kind}/{namespace}/{name}/logs:
    get:
      tags: [observability]
      summary: Aggregate bounded Pod and container logs for one workload
      description: |
        Opens up to 20 Pod/container log streams after authorizing `pods/log`
        for each Pod. Frames are newline-delimited JSON `log` entries carrying
        `pod` and `container`, plus `warning` frames for skipped streams and a
        terminal `end` frame. Supplying no container aggregates all regular
        containers from the workload template.
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
        - name: container
          in: query
          schema: { type: string }
        - name: follow
          in: query
          schema: { type: boolean, default: false }
        - name: tailLines
          in: query
          schema: { type: integer, minimum: 0, maximum: 5000, default: 200 }
        - name: timestamps
          in: query
          schema: { type: boolean, default: false }
        - name: previous
          in: query
          schema: { type: boolean, default: false }
        - name: sinceSeconds
          in: query
          schema: { type: integer, minimum: 0, maximum: 604800 }
      responses:
        "200":
          description: NDJSON aggregate log stream
          content:
            application/x-ndjson:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotSupported" }
  /api/v1/events:
    get:
      tags: [observability]
      summary: List cluster events
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/ObjectKind" }
        - { $ref: "#/components/parameters/ObjectName" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Order" }
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/events/stream:
    get:
      tags: [observability]
      summary: Watch events over Server-Sent Events
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
      responses:
        "200":
          description: SSE stream. Named event `event` contains an Event JSON payload; `error` contains a message.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/audit-events:
    get:
      tags: [observability]
      summary: List recent audit records retained by the serving dosh instance
      description: |
        Returns an in-memory, newest-first snapshot for administrator inspection.
        Records are retained per process and cleared on restart; durable retention
        remains the responsibility of stdout collection or the configured webhook sink.
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/Search" }
        - name: action
          in: query
          description: Case-insensitive exact action filter.
          schema: { type: string }
        - name: result
          in: query
          description: Case-insensitive exact result filter.
          schema: { type: string, enum: [success, failure, denied] }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Order" }
      responses:
        "200":
          description: Recent audit record list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditRecordList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/audit-events/actions:
    get:
      tags: [observability]
      summary: List audit action names present in the retained history
      description: Derives the filter directory from actual audit records so newly audited operations become filterable without a frontend-maintained enum.
      responses:
        "200":
          description: Distinct audit actions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditActionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/audit-events/export:
    get:
      tags: [observability]
      summary: Export the matching retained audit snapshot
      description: Exports all audit records currently matching the filters from the process-local retained snapshot. Format may be csv or json. A successful or denied export is itself recorded as the export-audit action after the snapshot is read.
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/Search" }
        - name: action
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { type: string, enum: [success, failure, denied] }
        - name: format
          in: query
          schema: { type: string, enum: [csv, json], default: csv }
      responses:
        "200":
          description: Audit export attachment
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/AuditExport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/services:
    get:
      tags: [network]
      summary: List services
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Order" }
      responses:
        "200":
          description: Service list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [network]
      summary: Create a Service
      description: |
        Creates a ClusterIP, Headless, NodePort or LoadBalancer Service. A Headless
        Service uses type ClusterIP with headless=true (clusterIP: None), so DNS
        returns the selected Pod addresses directly without kube-proxy load balancing.
        Kubernetes allocates NodePorts automatically. Selector labels associate the
        resulting EndpointSlice addresses with a workload's pods.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCreate" }
      responses:
        "201":
          description: Created Service detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/pods/{namespace}/{name}/terminal:
    get:
      tags: [workloads]
      summary: Upgrade to a same-origin WebSocket and bridge to Kubernetes Pod exec
      description: |
        Requires `create pods/exec` through SubjectAccessReview. Messages are JSON
        text frames. Input and output payloads are base64 encoded. Resize messages
        carry columns and rows. The shell is allow-listed to sh, bash or ash. The
        server closes idle sessions, sessions exceeding the configured maximum
        duration, and sessions exceeding the per-second output budget. A terminal
        `exit` frame carries a `reason` such as idle_timeout or output_limit.
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
        - name: container
          in: query
          required: true
          schema: { type: string }
        - name: shell
          in: query
          schema: { type: string, enum: [sh, bash, ash], default: sh }
        - name: cols
          in: query
          schema: { type: integer, minimum: 20, maximum: 300, default: 100 }
        - name: rows
          in: query
          schema: { type: integer, minimum: 5, maximum: 100, default: 30 }
      responses:
        "101": { description: WebSocket protocol switch }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/tunnels/{id}:
    get:
      tags: [workloads]
      summary: Redirect a tunnel URL to its trailing-slash proxy path
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "307": { description: Redirect to the active tunnel proxy path }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [workloads]
      summary: Close and revoke a port-forward session
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Tunnel closed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tunnels/{id}/{path}:
    get:
      tags: [workloads]
      summary: Proxy GET requests through an active tunnel
      description: The tunnel session cookie is required. Dosh session and OIDC state cookies are filtered before forwarding.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Upstream response }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    post:
      tags: [workloads]
      summary: Proxy POST requests through an active tunnel
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Upstream response }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: Request body exceeds the 16 MiB tunnel limit }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    put:
      tags: [workloads]
      summary: Proxy PUT requests through an active tunnel
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Upstream response }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: Request body exceeds the 16 MiB tunnel limit }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    patch:
      tags: [workloads]
      summary: Proxy PATCH requests through an active tunnel
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Upstream response }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: Request body exceeds the 16 MiB tunnel limit }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    delete:
      tags: [workloads]
      summary: Proxy DELETE requests through an active tunnel
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Upstream response }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/releases:
    get:
      tags: [releases]
      summary: List latest Helm release revisions stored in one namespace
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
      responses:
        "200":
          description: Helm release summaries and non-fatal decode warnings
          content:
            application/json:
              schema:
                type: object
                required: [items, warnings]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/HelmReleaseSummary" }
                  warnings:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/releases/{namespace}/{name}:
    get:
      tags: [releases]
      summary: Read one Helm release with redacted values, manifest and history
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Redacted Helm release detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelmReleaseDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/releases/{namespace}/{name}/diff:
    get:
      tags: [releases]
      summary: Compare two server-redacted Helm revisions
      description: Both revisions are redacted before a bounded unified diff is generated. At most 6000 source lines per side are compared.
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
        - name: from
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: to
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Redacted values and manifest diff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelmReleaseDiff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/releases/{namespace}/{name}/rollback:
    post:
      tags: [releases]
      summary: Apply a previous Helm revision and record new Helm history
      description: >-
        Preflights every manifest object with server-side apply DryRun before
        applying any object. Helm hooks are skipped and removed objects are not
        deleted; both limitations are returned as warnings. Requires create and
        update access to Secrets in the release namespace. The release name must
        be supplied as confirmation.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelmReleaseRollbackRequest" }
      responses:
        "202":
          description: Rollback completed and new Helm revision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelmReleaseRollbackResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/releases/{namespace}/{name}/upgrade/preview:
    post:
      tags: [releases]
      summary: Render a Helm upgrade preview using server-side current values
      description: >-
        Merges the supplied Values YAML as an override over the unredacted values
        stored in the current Helm revision, renders the stored chart, and returns
        server-redacted Values and Manifest diffs. This endpoint never mutates the
        cluster. Requires list Secrets permission in the release namespace.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelmReleaseUpgradeRequest" }
      responses:
        "200":
          description: Redacted upgrade preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelmReleaseUpgradePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/releases/{namespace}/{name}/upgrade:
    post:
      tags: [releases]
      summary: Render and apply a Helm-compatible upgrade revision
      description: >-
        Renders the chart stored in the current revision with server-side values
        merged with the supplied override. Every object is server-side apply
        DryRun preflighted before any live write. Helm hooks are skipped and
        removed objects are not pruned; both are reported as warnings. Requires
        create and update access to Secrets and exact release-name confirmation.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelmReleaseUpgradeRequest" }
      responses:
        "202":
          description: Upgrade completed and new Helm revision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelmReleaseUpgradeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/repositories:
    get:
      tags: [helm-charts]
      summary: List administrator-managed Helm Chart repositories
      responses:
        "200":
          description: Helm repositories without credentials
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/HelmRepository" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    post:
      tags: [helm-charts]
      summary: Register an HTTP/HTTPS index or OCI Chart repository
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelmRepositoryUpsert" }
      responses:
        "201":
          description: Repository registered and initial synchronization attempted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelmRepository" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/repositories/{id}:
    put:
      tags: [helm-charts]
      summary: Update an HTTP/HTTPS index or OCI Chart repository
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelmRepositoryUpsert" }
      responses:
        "200":
          description: Updated repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelmRepository" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    delete:
      tags: [helm-charts]
      summary: Delete a Helm Chart repository
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 128 } }
        - { name: revision, in: query, schema: { type: string, maxLength: 256 } }
      responses:
        "200":
          description: Repository deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/repositories/{id}/sync:
    post:
      tags: [helm-charts]
      summary: Synchronize a repository catalog and record health
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: Repository with the latest synchronization result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelmRepository" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/charts:
    get:
      tags: [helm-charts]
      summary: Browse charts from enabled Helm repositories
      parameters:
        - { name: repositoryId, in: query, schema: { type: string, maxLength: 128 } }
        - { $ref: "#/components/parameters/Search" }
      responses:
        "200":
          description: Chart catalog and repository warnings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/HelmChartSummary" }
                  warnings:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/charts/{repositoryId}/{chartName}:
    get:
      tags: [helm-charts]
      summary: Read Chart metadata, versions, README, default values and schema
      parameters:
        - { name: repositoryId, in: path, required: true, schema: { type: string, maxLength: 128 } }
        - { name: chartName, in: path, required: true, schema: { type: string, maxLength: 253 } }
      responses:
        "200":
          description: Chart detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelmChartDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/charts/{repositoryId}/{chartName}/sync:
    post:
      tags: [helm-charts]
      summary: Refresh the cached Chart package and its extracted metadata
      description: >-
        Deletes the cached package for the latest Chart version and downloads it
        again. The repository index is not re-synchronized; use the repository
        sync endpoint when the Chart catalog itself needs refreshing.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { name: repositoryId, in: path, required: true, schema: { type: string, maxLength: 128 } }
        - { name: chartName, in: path, required: true, schema: { type: string, maxLength: 253 } }
      responses:
        "200":
          description: Refreshed Chart detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelmChartDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/charts/plan:
    post:
      tags: [helm-charts]
      summary: Render a chart and preflight resources, hooks and RBAC
      description: >-
        The response includes a planDigest bound to the exact chart package,
        values, target namespace, release name, current revision and rendered
        resources. Installation and upgrade require this digest.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelmChartPlanRequest" }
      responses:
        "200":
          description: Reviewed install or upgrade plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelmChartPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/charts/install:
    post:
      tags: [helm-charts]
      summary: Install a reviewed Helm Chart plan
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelmChartOperationRequest" }
      responses:
        "201":
          description: Install completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelmChartOperation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/charts/upgrade:
    post:
      tags: [helm-charts]
      summary: Upgrade a release to a reviewed Helm Chart plan
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelmChartOperationRequest" }
      responses:
        "200":
          description: Upgrade completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelmChartOperation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/charts/uninstall:

        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/helm/releases/{namespace}/{name}/upgrade:
    post:
      tags: [releases]
      summary: Render and apply a Helm-compatible upgrade revision
      description: >-
        Renders the chart stored in the current revision with server-side values
        merged with the supplied override. Every object is server-side apply
        DryRun preflighted before any live write. Helm hooks are skipped and
        removed objects are not pruned; both are reported as warnings. Requires
        create and update access to Secrets and exact release-name confirmation.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelmReleaseUpgradeRequest" }
      responses:
        "202":
          description: Upgrade completed and new Helm revision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelmReleaseUpgradeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCreate" }
      responses:
        "201":
          description: Created Service detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDetail" }

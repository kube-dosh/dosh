        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    put:
      tags: [resources]
      summary: Update one discovered Kubernetes resource from YAML
      description: >-
        Requires update or patch access. A real update always performs an
        internal API Server dry run first. Generic Secret updates are disabled.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ResourceGroupPath"
        - $ref: "#/components/parameters/ResourceVersionPath"
        - $ref: "#/components/parameters/ResourceNamePath"
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Namespace"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenericResourceMutation" }
      responses:
        "200":
          description: Resource updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericResourceDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    delete:
      tags: [resources]
      summary: Delete one discovered Kubernetes resource
      description: >-
        Deletes through the discovered GVR after delete authorization. A caller
        supplied resourceVersion is used as a Kubernetes precondition.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ResourceGroupPath"
        - $ref: "#/components/parameters/ResourceVersionPath"
        - $ref: "#/components/parameters/ResourceNamePath"
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Namespace"
        - name: resourceVersion
          in: query
          schema: { type: string }
        - name: propagation
          in: query
          schema:
            type: string
            enum: [Background, Foreground, Orphan]
            default: Background
        - name: confirmation
          in: query
          schema: { type: string }
          description: Required for critical/high-risk resource deletion; must equal the resource name.
      responses:
        "202":
          description: Deletion accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }

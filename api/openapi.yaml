    get:
      tags: [diagnostics]
      summary: Run a deterministic read-only diagnosis for one namespaced Kubernetes object
      description: >-
        Inspects one Pod, workload, Service, Ingress or PVC using bounded reads.
        The response is evidence-backed and never mutates or remediates resources.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [pod, deployment, statefulset, daemonset, job, cronjob, service, ingress, pvc, persistentvolumeclaim]
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Diagnosis report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diagnosis" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/diagnostics/{kind}/{name}:
    get:
      tags: [diagnostics]
      summary: Run a deterministic read-only diagnosis for one cluster-scoped Kubernetes object
      description: Currently supports Node. Namespaced objects must use the three-segment route.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [node]
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Diagnosis report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diagnosis" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }

    ResourceDescriptor:
      type: object
      required: [group, version, resource, kind, namespaced, verbs]
      properties:
        group: { type: string }
        version: { type: string }
        resource: { type: string }
        kind: { type: string }
        singularName: { type: string }
        namespaced: { type: boolean }

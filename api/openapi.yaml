openapi: 3.1.0
info:
  title: Dosh Kubernetes Operations API
  version: 0.1.6
  description: |
    Same-origin API consumed by the Dosh embedded React console. Session cookies
    are HttpOnly and every mutating request must include the session CSRF token.
    Kubernetes objects are translated into stable DTOs; arbitrary Kubernetes API
    proxying is intentionally not supported.
servers:
  - url: /
tags:
  - name: auth
  - name: cluster
  - name: workloads
  - name: observability
  - name: network
  - name: configuration
  - name: certificates
  - name: storage
  - name: yaml
security:
  - cookieAuth: []
paths:
  /api/v1/session:
    get:
      tags: [auth]
      summary: Read the current session
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [auth]
      summary: Authenticate with local credentials or a Kubernetes bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: Local administrator credentials
                  required: [username, password]
                  properties:
                    username: { type: string, minLength: 1 }
                    password: { type: string, minLength: 1, format: password }
                - type: object
                  description: Kubernetes bearer token validated with TokenReview
                  required: [token]
                  properties:
                    token: { type: string, minLength: 1, maxLength: 16384 }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [auth]
      summary: Clear the current session cookie
      responses:
        "204": { description: Session cleared }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/capabilities:
    get:
      tags: [auth]
      summary: Read current user capabilities
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Capability flags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/config:
    get:
      tags: [auth]
      summary: Read public authentication mode
      security: []
      responses:
        "200":
          description: Authentication configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /api/v1/auth/oidc/login:
    get:
      tags: [auth]
      summary: Start OIDC Authorization Code with PKCE
      security: []
      parameters:
        - name: returnTo
          in: query
          schema: { type: string }
      responses:
        "302": { description: Redirect to the OIDC provider }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/oidc/callback:
    get:
      tags: [auth]
      summary: Complete OIDC Authorization Code flow
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to the validated return path or login error }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/oidc/logout:
    get:
      tags: [auth]
      summary: Clear the session and perform RP-initiated logout when supported
      responses:
        "302": { description: Redirect to the provider or local login page }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/overview:
    get:
      tags: [cluster]
      summary: Aggregate cluster overview
      responses:
        "200":
          description: Cluster overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/cluster/config:
    get:
      tags: [cluster]
      summary: Read non-secret cluster identity and network configuration
      responses:
        "200":
          description: Cluster configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterConfiguration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/nodes:
    get:
      tags: [cluster]
      summary: List nodes
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Order" }
      responses:
        "200":
          description: Node list
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/NodeSummary" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/nodes/{name}:
    get:
      tags: [cluster]
      summary: Get node detail, conditions, taints and pods
      parameters:
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Node detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/nodes/{name}/cordon:
    post:
      tags: [cluster]
      summary: Mark a node unschedulable without evicting existing pods
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Updated node summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/nodes/{name}/uncordon:
    post:
      tags: [cluster]
      summary: Restore scheduling on a cordoned node
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Updated node summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/nodes/{name}/labels:
    put:
      tags: [cluster]
      summary: Replace node labels using the loaded resource version
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeLabelUpdate" }
      responses:
        "200":
          description: Updated node detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/nodes/{name}/taints:
    put:
      tags: [cluster]
      summary: Replace node taints using the loaded resource version
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeTaintUpdate" }
      responses:
        "200":
          description: Updated node detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/namespaces:
    get:
      tags: [cluster]
      summary: List namespaces
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Order" }
      responses:
        "200":
          description: Namespace list
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Namespace" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [cluster]
      summary: Create a namespace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NamespaceCreate" }
      responses:
        "201":
          description: Namespace created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Namespace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/namespaces/{name}:
    get:
      tags: [cluster]
      summary: Get namespace detail
      parameters:
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Namespace detail with resource quotas and limit ranges
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NamespaceDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [cluster]
      summary: Delete a namespace and all resources it contains
      description: |
        Deletes the namespace with foreground cascading deletion. The default and
        kube-* system namespaces are protected. Supplying resourceVersion enables
        an optimistic-concurrency precondition.
      parameters:
        - { $ref: "#/components/parameters/Name" }
        - name: resourceVersion
          in: query
          schema: { type: string }
      responses:
        "202":
          description: Namespace deletion accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/workloads:
    get:
      tags: [workloads]
      summary: List supported workload kinds
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Kind" }
        - { $ref: "#/components/parameters/WorkloadStatus" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Order" }
      responses:
        "200":
          description: Workload list
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WorkloadSummary" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/workloads/deployments:
    post:
      tags: [workloads]
      summary: Validate with API Server dry-run and create a Deployment
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentCreateRequest" }
      responses:
        "201":
          description: Deployment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/workloads/deployments/preview:
    post:
      tags: [workloads]
      summary: Preview the validated Deployment manifest without writing
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentCreateRequest" }
      responses:
        "200":
          description: Deployment manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/workloads/{kind}/{namespace}/{name}:
    get:
      tags: [workloads]
      summary: Get workload detail and owned pods
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Workload detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotSupported" }
    delete:
      tags: [workloads]
      summary: Delete a workload
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
        - name: propagation
          in: query
          schema:
            type: string
            enum: [Background, Foreground, Orphan]
            default: Background
      responses:
        "202":
          description: Deletion accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/workloads/{kind}/{namespace}/{name}/scale:
    post:
      tags: [workloads]
      summary: Scale a Deployment or StatefulSet
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replicas]
              properties:
                replicas: { type: integer, minimum: 0, maximum: 1000 }
                resourceVersion: { type: string }
      responses:
        "200":
          description: Scale accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
  /api/v1/workloads/{kind}/{namespace}/{name}/restart:
    post:
      tags: [workloads]
      summary: Trigger a rolling restart
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Restart accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotSupported" }
  /api/v1/workloads/{kind}/{namespace}/{name}/image:
    post:
      tags: [workloads]
      summary: Update one container image in a Deployment, StatefulSet or DaemonSet
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [containerName, image]
              properties:
                containerName: { type: string, minLength: 1, maxLength: 63 }
                image: { type: string, minLength: 1, maxLength: 512 }
                resourceVersion: { type: string, maxLength: 256 }
      responses:
        "200":
          description: Image update accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/workloads/{kind}/{namespace}/{name}/containers/{container}/config:
    put:
      tags: [workloads]
      summary: Update environment, volume mounts and health probes for one container
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
        - name: container
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 63 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkloadContainerConfigUpdate" }
      responses:
        "200":
          description: Container configuration updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/workloads/{kind}/{namespace}/{name}/suspend:
    post:
      tags: [workloads]
      summary: Pause or resume future scheduling for a CronJob
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/KindPath" }
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspend]
              properties:
                suspend: { type: boolean }
                resourceVersion: { type: string, maxLength: 256 }
      responses:
        "200":
          description: CronJob scheduling state updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotSupported" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/pods:
    get:
      tags: [workloads]
      summary: List pods
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Order" }
      responses:
        "200":
          description: Pod list
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PodSummary" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/pods/{namespace}/{name}:
    get:
      tags: [workloads]
      summary: Get pod detail
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: Pod detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PodDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [workloads]
      summary: Delete a Pod
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      responses:
        "202":
          description: Pod deletion accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/pods/{namespace}/{name}/logs:
    get:
      tags: [observability]
      summary: Stream pod container logs as bounded NDJSON frames
      description: |
        Streams newline-delimited JSON frames. A `log` frame carries one UTF-8
        log chunk. A clean EOF terminates with an `end` frame. A stream failure
        after headers are sent terminates with an `error` frame containing a
        stable code, safe message and request ID. Errors detected before the
        stream starts use the normal JSON Problem response.
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
        - name: container
          in: query
          schema: { type: string }
        - name: follow
          in: query
          schema: { type: boolean, default: false }
        - name: tailLines
          in: query
          schema: { type: integer, minimum: 0, maximum: 5000, default: 200 }
        - name: timestamps
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: NDJSON log stream (`log`, `end` or terminal `error` frames)
          content:
            application/x-ndjson:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

          items: { $ref: "#/components/schemas/ResourceDescriptor" }
        warnings:
          type: array
          items: { type: string }
    ResourceSchema:
      type: object
      required: [group, version, resource, kind, source, schema]
      properties:
        group: { type: string }
        version: { type: string }
        resource: { type: string }
        kind: { type: string }
        source: { type: string, enum: [openapi-v2, unavailable] }
        schema:
          type: object
          additionalProperties: true
        definitions:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
        warnings:
          type: array
          items: { type: string }
    GenericResourceSummary:
      type: object
      required: [apiVersion, kind, name]
      properties:
        apiVersion: { type: string }
        kind: { type: string }
        resource: { type: string }
        name: { type: string }
        namespace: { type: string }
        uid: { type: string }
        resourceVersion: { type: string }
        createdAt: { type: string, format: date-time }
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        cells:
          type: object
          additionalProperties: true
          description: Values aligned to the columns returned in list metadata by the Kubernetes Table API.
    GenericResourceSearch:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GenericResourceSummary" }

      responses:
        "200":
          description: Updated PersistentVolumeClaim detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersistentVolumeClaimDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    delete:
      tags: [storage]
      summary: Delete a PersistentVolumeClaim
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
        - name: resourceVersion
          in: query
          schema: { type: string }
      responses:
        "202":
          description: PersistentVolumeClaim deletion accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/yaml:
    get:
      tags: [yaml]
      summary: Read YAML for an allow-listed resource
      parameters:
        - name: type
          in: query
          required: true
          schema: { $ref: "#/components/schemas/ResourceType" }
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/Name" }
      responses:
        "200":
          description: YAML resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YAMLResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/yaml/apply:
    post:
      tags: [yaml]
      summary: Validate with server-side dry run, then server-side apply
      description: >-
        Supports one allow-listed YAML document per request. The backend checks whether
        the target exists, then requires create for a new resource or update/patch for
        an existing resource before running Server-Side Apply.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml, dryRun]
              properties:
                yaml:
                  type: string
                  minLength: 1
                  description: Exactly one YAML document up to 1 MiB. Empty documents, multiple documents and duplicate keys are rejected before authorization or apply.
                resourceVersion: { type: string }
                dryRun: { type: boolean }
      responses:
        "200":
          description: Applied YAML returned by the API Server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YAMLResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
        "501": { $ref: "#/components/responses/NotSupported" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dosh_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Namespace:
      name: namespace
      in: query
      schema: { type: string }
    NamespacePath:
      name: namespace
      in: path
      required: true
      schema: { type: string }
    Search:
      name: q
      in: query
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200 }
    Sort:
      name: sort
      in: query
      description: Resource-specific sort field. Unsupported fields return 400.
      schema: { type: string }
    Order:
      name: order
      in: query
      description: Sort direction; requires sort.
      schema: { type: string, enum: [asc, desc], default: asc }
    ObjectKind:
      name: objectKind
      in: query
      description: Case-insensitive involved object kind filter for events.
      schema: { type: string }
    ObjectName:
      name: objectName
      in: query
      description: Involved object name filter for events.
      schema: { type: string }
    Kind:
      name: kind
      in: query
      schema: { $ref: "#/components/schemas/WorkloadKind" }
    WorkloadStatus:
      name: status
      in: query
      description: Case-insensitive workload status filter.
      schema: { type: string }
    KindPath:
      name: kind
      in: path
      required: true
      schema: { $ref: "#/components/schemas/WorkloadKind" }
    Name:
      name: name
      in: path
      required: true
      schema: { type: string }
  responses:
    Session:
      description: Authenticated session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Permission or read-only mode denied the operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Resource version conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Login rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    DependencyUnavailable:
      description: Kubernetes API unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotSupported:
      description: Operation not supported for this resource kind
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
    ListMeta:
      type: object
      required: [total, page, pageSize, totalPages]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalPages: { type: integer, minimum: 0 }
        sort: { type: string }
        order: { type: string, enum: [asc, desc] }
        filters:
          type: object
          additionalProperties: { type: string }
        namespace: { type: string }
        search: { type: string }
        kind: { type: string }
        status: { type: string }
    OperationStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Actor:
      type: object
      required: [username, admin]
      properties:
        username: { type: string }
        groups:
          type: array
          items: { type: string }
        admin: { type: boolean }
    Capabilities:
      type: object
      required: [read, scale, restart, updateImage, suspendCronJob, delete, create, createService, updateService, deleteService, deleteNamespace, revealSecrets, editYAML, nodeCordon, reloadCertificate]
      properties:
        read: { type: boolean }
        scale: { type: boolean }
        restart: { type: boolean }
        updateImage: { type: boolean }
        suspendCronJob: { type: boolean }
        delete: { type: boolean }
        create: { type: boolean }
        createService: { type: boolean }
        updateService: { type: boolean }
        deleteService: { type: boolean }
        deleteNamespace: { type: boolean }
        revealSecrets: { type: boolean }
        editYAML: { type: boolean }
        nodeCordon: { type: boolean }
        reloadCertificate: { type: boolean }
        resourceActions:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ResourceCapabilities" }
    ResourceCapabilities:
      type: object
      required: [create, update, delete, scale]
      properties:
        create: { type: boolean }
        update: { type: boolean }
        delete: { type: boolean }
        scale: { type: boolean }
    ServerCertificate:
      type: object
      required: [mode, enabled, configured, status, dnsNames, ipAddresses, daysRemaining, autoReload, reloadIntervalSeconds]
      properties:
        mode: { type: string, enum: [https, http] }
        enabled: { type: boolean }
        configured: { type: boolean }
        status: { type: string, enum: [valid, expiring, expired, not_yet_valid, disabled, unavailable] }
        subject: { type: string }
        issuer: { type: string }
        serialNumber: { type: string }
        dnsNames:
          type: array
          items: { type: string }
        ipAddresses:
          type: array
          items: { type: string }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        daysRemaining: { type: integer }
        fingerprintSha256: { type: string }
        keyAlgorithm: { type: string }
        autoReload: { type: boolean }
        reloadIntervalSeconds: { type: integer, minimum: 0 }
        lastReloadedAt: { type: string, format: date-time }
        lastReloadError: { type: string }
    Session:
      type: object
      required: [user, csrfToken, expiresAt, capabilities, authMode]
      properties:
        user: { $ref: "#/components/schemas/Actor" }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        authMode: { type: string, enum: [local, oidc, token] }
    AuthConfig:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [local, oidc, token] }
        providerName: { type: string }
    Condition:
      type: object
      required: [type, status]
      properties:
        type: { type: string }
        status: { type: string }
        reason: { type: string }
        message: { type: string }
        lastTransitionTime: { type: string, format: date-time }
    Event:
      type: object
      required: [uid, namespace, type, reason, message, objectKind, objectName, count, firstSeen, lastSeen]
      properties:
        uid: { type: string }
        namespace: { type: string }
        type: { type: string }
        reason: { type: string }
        message: { type: string }
        objectKind: { type: string }
        objectName: { type: string }
        count: { type: integer }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        source: { type: string }
    AuditRecord:
      type: object
      required: [id, timestamp, user, action, resource, result]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        timestamp: { type: string, format: date-time }
        user: { type: string }
        groups:
          type: array
          items: { type: string }
        action: { type: string }
        resource: { type: string }
        namespace: { type: string }
        name: { type: string }
        result: { type: string, enum: [success, failure, denied] }
        requestId: { type: string }
        error: { type: string }
    AuditRecordList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditRecord" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    ClusterNodeCIDR:
      type: object
      required: [name, podCIDRs]
      properties:
        name: { type: string }
        internalIP: { type: string }
        podCIDRs:
          type: array
          items: { type: string }
    ClusterConfiguration:
      type: object
      required: [name, version, nodeCIDRs]
      properties:
        name: { type: string }
        version: { type: string }
        platform: { type: string }
        cni: { type: string }
        controlPlaneEndpoint: { type: string }
        podCIDR: { type: string }
        serviceCIDR: { type: string }
        dnsDomain: { type: string }
        kubernetesServiceIP: { type: string }
        dnsServiceIP: { type: string }
        source: { type: string }
        nodeCIDRs:
          type: array
          items: { $ref: "#/components/schemas/ClusterNodeCIDR" }
        warnings:
          type: array
          items: { type: string }
    ClusterInfo:
      type: object
      required: [name, version, status, metricsAvailable]
      properties:
        name: { type: string }
        version: { type: string }
        platform: { type: string }
        cni: { type: string }
        status: { type: string }
        metricsAvailable: { type: boolean }
    OverviewCounts:
      type: object
      required: [nodes, readyNodes, pods, runningPods, workloads, namespaces, unhealthyPods, warningEvents]
      properties:
        nodes: { type: integer }
        readyNodes: { type: integer }
        pods: { type: integer }
        runningPods: { type: integer }
        workloads: { type: integer }
        namespaces: { type: integer }
        unhealthyPods: { type: integer }
        warningEvents: { type: integer }
    ClusterCapacity:
      type: object
      required: [cpuAllocatableMilli, memoryAllocatableBytes, podCapacity, cpuRequestsMilli, memoryRequestsBytes, cpuLimitsMilli, memoryLimitsBytes, cpuUsageMilli, memoryUsageBytes]
      properties:
        cpuAllocatableMilli: { type: integer, format: int64 }
        memoryAllocatableBytes: { type: integer, format: int64 }
        podCapacity: { type: integer, format: int64 }
        cpuRequestsMilli: { type: integer, format: int64 }
        memoryRequestsBytes: { type: integer, format: int64 }
        cpuLimitsMilli: { type: integer, format: int64 }
        memoryLimitsBytes: { type: integer, format: int64 }
        cpuUsageMilli: { type: integer, format: int64 }
        memoryUsageBytes: { type: integer, format: int64 }
    Overview:
      type: object
      required: [cluster, counts, capacity, recentEvents]
      properties:
        cluster: { $ref: "#/components/schemas/ClusterInfo" }
        counts: { $ref: "#/components/schemas/OverviewCounts" }
        capacity: { $ref: "#/components/schemas/ClusterCapacity" }
        recentEvents:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        warnings:
          type: array
          items: { type: string }
    NodeSummary:
      type: object
      required: [name, status, roles, internalIP, version, osImage, kernelVersion, containerRuntime, cpuCapacityMilli, memoryCapacityBytes, podCapacity, podCount, cpuRequestsMilli, memoryRequestsBytes, unschedulable, createdAt]
      properties:
        name: { type: string }
        status: { type: string }
        roles:
          type: array
          items: { type: string }
        internalIP: { type: string }
        version: { type: string }
        osImage: { type: string }
        kernelVersion: { type: string }
        containerRuntime: { type: string }
        cpuCapacityMilli: { type: integer, format: int64 }
        memoryCapacityBytes: { type: integer, format: int64 }
        podCapacity: { type: integer, format: int64 }
        podCount: { type: integer }
        cpuRequestsMilli: { type: integer, format: int64 }
        memoryRequestsBytes: { type: integer, format: int64 }
        cpuUsageMilli: { type: integer, format: int64 }
        memoryUsageBytes: { type: integer, format: int64 }
        hasMetrics: { type: boolean }
        unschedulable: { type: boolean }
        createdAt: { type: string, format: date-time }
    NodeDetail:
      allOf:
        - { $ref: "#/components/schemas/NodeSummary" }
        - type: object
          required: [resourceVersion, conditions, taints, labels, annotations, pods]
          properties:
            resourceVersion: { type: string }
            conditions:
              type: array
              items: { $ref: "#/components/schemas/Condition" }
            taints:
              type: array
              items: { $ref: "#/components/schemas/Taint" }
            labels:
              type: object
              additionalProperties: { type: string }
            annotations:
              type: object
              additionalProperties: { type: string }
            pods:
              type: array
              items: { $ref: "#/components/schemas/PodSummary" }
    Taint:
      type: object
      required: [key, effect]
      properties:
        key: { type: string }
        value: { type: string }
        effect: { type: string, enum: [NoSchedule, PreferNoSchedule, NoExecute] }
        timeAdded: { type: string }
    NodeLabelUpdate:
      type: object
      required: [labels]
      properties:
        labels:
          type: object
          additionalProperties: { type: string }
        resourceVersion: { type: string }
    NodeTaintUpdate:
      type: object
      required: [taints]
      properties:
        taints:
          type: array
          items: { $ref: "#/components/schemas/Taint" }
        resourceVersion: { type: string }
    Namespace:
      type: object
      required: [name, status, createdAt]
      properties:
        name: { type: string }
        status: { type: string }
        resourceVersion: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
    NamespaceCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
    NamespaceDetail:
      allOf:
        - { $ref: "#/components/schemas/Namespace" }
        - type: object
          required: [resourceQuotas, limitRanges]
          properties:
            resourceQuotas:
              type: array
              items: { $ref: "#/components/schemas/ResourceQuota" }
            limitRanges:
              type: array
              items: { $ref: "#/components/schemas/LimitRange" }
    ResourceQuota:
      type: object
      required: [name, hard, used, createdAt]
      properties:
        name: { type: string }
        hard:
          type: object
          additionalProperties: { type: string }
        used:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
    LimitRange:
      type: object
      required: [name, limits, createdAt]
      properties:
        name: { type: string }
        limits:
          type: array
          items: { $ref: "#/components/schemas/LimitRangeItem" }
        createdAt: { type: string, format: date-time }
    LimitRangeItem:
      type: object
      required: [type, min, max, default, defaultRequest]
      properties:
        type: { type: string }
        min:
          type: object
          additionalProperties: { type: string }
        max:
          type: object
          additionalProperties: { type: string }
        default:
          type: object
          additionalProperties: { type: string }
        defaultRequest:
          type: object
          additionalProperties: { type: string }
    WorkloadKind:
      type: string
      enum: [deployment, statefulset, daemonset, job, cronjob]
    WorkloadSummary:
      type: object
      required: [kind, name, namespace, status, ready, desired, restarts, images, createdAt]
      properties:
        kind: { type: string }
        name: { type: string }
        namespace: { type: string }
        resourceVersion: { type: string }
        status: { type: string }
        ready: { type: string }
        desired: { type: integer }
        restarts: { type: integer }
        images:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        labels:
          type: object
          additionalProperties: { type: string }
    DeploymentEnvVar:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }
    DeploymentCreateRequest:
      type: object
      required: [name, namespace, replicas, image, containerPort]
      properties:
        name: { type: string, minLength: 1, maxLength: 63 }
        namespace: { type: string, minLength: 1, maxLength: 63 }
        replicas: { type: integer, minimum: 0, maximum: 1000 }
        containerName: { type: string, maxLength: 63 }
        image: { type: string, minLength: 1, maxLength: 512 }
        containerPort: { type: integer, minimum: 1, maximum: 65535 }
        cpuRequestMilli: { type: integer, minimum: 0, maximum: 128000 }
        cpuLimitMilli: { type: integer, minimum: 0, maximum: 128000 }
        memoryRequestBytes: { type: integer, minimum: 0, maximum: 1099511627776 }
        memoryLimitBytes: { type: integer, minimum: 0, maximum: 1099511627776 }
        env:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/DeploymentEnvVar" }
        labels:
          type: object
          maxProperties: 32
          additionalProperties: { type: string }
    DeploymentPreview:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string }
    WorkloadDetail:
      allOf:
        - { $ref: "#/components/schemas/WorkloadSummary" }
        - type: object
          required: [conditions, selector, pods, volumes, containers]
          properties:
            conditions:
              type: array
              items: { $ref: "#/components/schemas/Condition" }
            selector:
              type: object
              additionalProperties: { type: string }
            pods:
              type: array
              items: { $ref: "#/components/schemas/PodSummary" }
            volumes:
              type: array
              items: { $ref: "#/components/schemas/WorkloadVolume" }
            containers:
              type: array
              items: { $ref: "#/components/schemas/WorkloadContainer" }
    WorkloadContainer:
      type: object
      required: [name, image, ports, resources, env, volumeMounts]
      properties:
        name: { type: string }
        image: { type: string }
        ports:
          type: array
          items: { $ref: "#/components/schemas/WorkloadContainerPort" }
        resources: { $ref: "#/components/schemas/WorkloadContainerResources" }
        env:
          type: array
          items: { $ref: "#/components/schemas/WorkloadEnvVar" }
        volumeMounts:
          type: array
          items: { $ref: "#/components/schemas/WorkloadVolumeMount" }
        livenessProbe: { $ref: "#/components/schemas/WorkloadProbe" }
        readinessProbe: { $ref: "#/components/schemas/WorkloadProbe" }
        startupProbe: { $ref: "#/components/schemas/WorkloadProbe" }
    WorkloadContainerPort:
      type: object
      required: [containerPort, protocol]
      properties:
        name: { type: string }
        containerPort: { type: integer }
        protocol: { type: string }
    WorkloadContainerResources:
      type: object
      required: [cpuRequestMilli, cpuLimitMilli, memoryRequestBytes, memoryLimitBytes]
      properties:
        cpuRequestMilli: { type: integer, format: int64 }
        cpuLimitMilli: { type: integer, format: int64 }
        memoryRequestBytes: { type: integer, format: int64 }
        memoryLimitBytes: { type: integer, format: int64 }
    WorkloadEnvVar:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }
        valueFrom: { $ref: "#/components/schemas/WorkloadEnvValueFrom" }
    WorkloadEnvValueFrom:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [configMapKeyRef, secretKeyRef, fieldRef, resourceFieldRef]
        name: { type: string }
        key: { type: string }
        optional: { type: boolean }
    WorkloadVolumeMount:
      type: object
      required: [name, mountPath, readOnly]
      properties:
        name: { type: string }
        mountPath: { type: string }
        subPath: { type: string }
        readOnly: { type: boolean }
    WorkloadVolume:
      type: object
      required: [name, type, source, readOnly]
      properties:
        name: { type: string }
        type: { type: string }
        source: { type: string }
        readOnly: { type: boolean }
    WorkloadProbe:
      type: object
      required: [type, command, initialDelaySeconds, periodSeconds, timeoutSeconds, successThreshold, failureThreshold]
      properties:
        type:
          type: string
          enum: [httpGet, tcpSocket, exec, grpc]
        path: { type: string }
        host: { type: string }
        scheme: { type: string, enum: [HTTP, HTTPS] }
        port: { type: string }
        service: { type: string }
        command:
          type: array
          items: { type: string }
        initialDelaySeconds: { type: integer }
        periodSeconds: { type: integer }
        timeoutSeconds: { type: integer }
        successThreshold: { type: integer }
        failureThreshold: { type: integer }
    WorkloadContainerConfigUpdate:
      type: object
      required: [env, volumeMounts]
      properties:
        env:
          type: array
          maxItems: 128
          items: { $ref: "#/components/schemas/WorkloadEnvVar" }
        volumeMounts:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/WorkloadVolumeMount" }
        livenessProbe: { $ref: "#/components/schemas/WorkloadProbe" }
        readinessProbe: { $ref: "#/components/schemas/WorkloadProbe" }
        startupProbe: { $ref: "#/components/schemas/WorkloadProbe" }
        resourceVersion: { type: string, maxLength: 256 }
    PodSummary:
      type: object
      required: [name, namespace, status, ready, restarts, ip, node, createdAt]
      properties:
        name: { type: string }
        namespace: { type: string }
        status: { type: string }
        ready: { type: string }
        restarts: { type: integer }
        ip: { type: string }
        node: { type: string }
        ownerKind: { type: string }
        ownerName: { type: string }
        createdAt: { type: string, format: date-time }
        cpuUsageMilli: { type: integer, format: int64 }
        memoryUsageBytes: { type: integer, format: int64 }
        hasMetrics: { type: boolean }
        labels:
          type: object
          additionalProperties: { type: string }
    Container:
      type: object
      required: [name, image, ready, restartCount, state, cpuRequestMilli, cpuLimitMilli, memoryRequestBytes, memoryLimitBytes]
      properties:
        name: { type: string }
        image: { type: string }
        ready: { type: boolean }
        restartCount: { type: integer }
        state: { type: string }
        reason: { type: string }
        cpuRequestMilli: { type: integer, format: int64 }
        cpuLimitMilli: { type: integer, format: int64 }
        memoryRequestBytes: { type: integer, format: int64 }
        memoryLimitBytes: { type: integer, format: int64 }
    PodDetail:
      allOf:
        - { $ref: "#/components/schemas/PodSummary" }
        - type: object
          required: [containers, conditions, qosClass, serviceAccount]
          properties:
            containers:
              type: array
              items: { $ref: "#/components/schemas/Container" }
            conditions:
              type: array
              items: { $ref: "#/components/schemas/Condition" }
            qosClass: { type: string }
            serviceAccount: { type: string }
    ServicePort:
      type: object
      required: [protocol, port, targetPort]
      properties:
        name: { type: string }
        protocol: { type: string }
        port: { type: integer }
        targetPort: { type: string }
        nodePort: { type: integer }
    ServiceSummary:
      type: object
      required: [name, namespace, type, headless, clusterIP, externalIP, ports, endpointCount, createdAt]
      properties:
        name: { type: string }
        namespace: { type: string }
        resourceVersion: { type: string }
        type: { type: string }
        headless:
          type: boolean
          description: True when the Service has clusterIP None and DNS returns Pod addresses directly.
        clusterIP: { type: string }
        externalIP: { type: string }
        ports:
          type: array
          items: { $ref: "#/components/schemas/ServicePort" }
        selector:
          type: object
          additionalProperties: { type: string }
        endpointCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    ServicePortInput:
      type: object
      required: [port]
      properties:
        name: { type: string }
        protocol: { type: string, enum: [TCP, UDP, SCTP], default: TCP }
        port: { type: integer, minimum: 1, maximum: 65535 }
        targetPort:
          type: string
          description: Pod target port number or named container port.
    ServiceCreate:
      type: object
      required: [name, namespace, type, selector, ports]
      properties:
        name: { type: string }
        namespace: { type: string }
        type: { type: string, enum: [ClusterIP, NodePort, LoadBalancer] }
        headless:
          type: boolean
          default: false
          description: Create a Headless Service with clusterIP None. Requires type ClusterIP.
        selector:
          type: object
          additionalProperties: { type: string }
        ports:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/ServicePortInput" }
    ServiceUpdate:
      type: object
      required: [type, selector, ports]
      properties:
        type: { type: string, enum: [ClusterIP, NodePort, LoadBalancer] }
        headless:
          type: boolean
          default: false
          description: Must match the existing Service mode. Headless cannot be changed after creation.
        selector:
          type: object
          additionalProperties: { type: string }
        ports:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/ServicePortInput" }
        resourceVersion: { type: string }
    ServiceEndpoint:
      type: object
      required: [addresses, ready]
      properties:
        addresses:
          type: array
          items: { type: string }
        ready: { type: boolean }
        targetKind: { type: string }
        targetName: { type: string }
        targetNamespace: { type: string }
        nodeName: { type: string }
    ServiceDetail:
      allOf:
        - { $ref: "#/components/schemas/ServiceSummary" }
        - type: object
          required: [sessionAffinity, ipFamilies, endpoints]
          properties:
            labels:
              type: object
              additionalProperties: { type: string }
            annotations:
              type: object
              additionalProperties: { type: string }
            externalName: { type: string }
            sessionAffinity: { type: string }
            ipFamilies:
              type: array
              items: { type: string }
            ipFamilyPolicy: { type: string }
            loadBalancerClass: { type: string }
            endpoints:
              type: array
              items: { $ref: "#/components/schemas/ServiceEndpoint" }
    IngressPath:
      type: object
      required: [host, path, pathType, service, port, targetStatus]
      properties:
        host: { type: string }
        path: { type: string }
        pathType: { type: string }
        service: { type: string }
        port: { type: string }
        targetStatus:
          type: string
          enum: [Ready, NoReadyEndpoints, ServiceNotFound, PortNotFound, Unknown]
          description: Backend Service and ready Endpoint availability for this route.
    IngressSummary:
      type: object
      required: [name, namespace, class, paths, createdAt]
      properties:
        name: { type: string }
        namespace: { type: string }
        resourceVersion: { type: string }
        class: { type: string }
        paths:
          type: array
          items: { $ref: "#/components/schemas/IngressPath" }
        tlsHosts:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    IngressTLS:
      type: object
      required: [hosts]
      properties:
        hosts:
          type: array
          items: { type: string }
        secretName: { type: string }
    IngressDetail:
      allOf:
        - { $ref: "#/components/schemas/IngressSummary" }
        - type: object
          properties:
            labels:
              type: object
              additionalProperties: { type: string }
            annotations:
              type: object
              additionalProperties: { type: string }
            defaultBackend: { $ref: "#/components/schemas/IngressPath" }
            tls:
              type: array
              items: { $ref: "#/components/schemas/IngressTLS" }
    IngressPathInput:
      type: object
      required: [path, service, port]
      properties:
        host: { type: string }
        path: { type: string, pattern: '^/' }
        pathType: { type: string, enum: [Prefix, Exact, ImplementationSpecific], default: Prefix }
        service: { type: string }
        port:
          type: string
          description: Backend Service port number or named port.
    IngressCreate:
      type: object
      required: [name, namespace, paths]
      properties:
        name: { type: string }
        namespace: { type: string }
        class: { type: string }
        paths:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/IngressPathInput" }
        tls:
          type: array
          items: { $ref: "#/components/schemas/IngressTLS" }
        annotations:
          type: object
          additionalProperties: { type: string }
    IngressUpdate:
      type: object
      required: [paths]
      properties:
        class: { type: string }
        paths:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/IngressPathInput" }
        tls:
          type: array
          items: { $ref: "#/components/schemas/IngressTLS" }
        annotations:
          type: object
          additionalProperties: { type: string }
        resourceVersion: { type: string }
    ServiceList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ServiceSummary" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    IngressList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IngressSummary" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    IngressClassSummary:
      type: object
      required: [name, controller, default, createdAt]
      properties:
        name: { type: string }
        controller: { type: string }
        default: { type: boolean }
        createdAt: { type: string, format: date-time }
    IngressClassList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IngressClassSummary" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    ConfigMapSummary:
      type: object
      required: [name, namespace, keys, dataBytes, createdAt]
      properties:
        name: { type: string }
        namespace: { type: string }
        resourceVersion: { type: string }
        keys:
          type: array
          items: { type: string }
        dataBytes: { type: integer }
        createdAt: { type: string, format: date-time }
    ConfigMapDetail:
      allOf:
        - { $ref: "#/components/schemas/ConfigMapSummary" }
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: { type: string }
    ConfigMapCreate:
      type: object
      required: [name, namespace, data]
      properties:
        name: { type: string }
        namespace: { type: string }
        data:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
    ConfigMapUpdate:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        resourceVersion: { type: string }
    SecretKey:
      type: object
      required: [key, size]
      properties:
        key: { type: string }
        size: { type: integer }
    SecretSummary:
      type: object
      required: [name, namespace, type, keys, createdAt]
      properties:
        name: { type: string }
        namespace: { type: string }
        resourceVersion: { type: string }
        type: { type: string }
        keys:
          type: array
          items: { $ref: "#/components/schemas/SecretKey" }
        createdAt: { type: string, format: date-time }
    SecretReveal:
      allOf:
        - { $ref: "#/components/schemas/SecretSummary" }
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: { type: string, contentEncoding: base64 }
    SecretWrite:
      type: object
      required: [type, data]
      properties:
        name: { type: string }
        namespace: { type: string }
        type: { type: string, default: Opaque }
        data:
          type: object
          additionalProperties: { type: string, contentEncoding: base64 }
        annotations:
          type: object
          additionalProperties: { type: string }
        resourceVersion: { type: string }
    ConfigMapList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ConfigMapSummary" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    SecretList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SecretSummary" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    StorageClass:
      type: object
      required: [name, provisioner, reclaimPolicy, volumeBinding, default, createdAt]
      properties:
        name: { type: string }
        provisioner: { type: string }
        reclaimPolicy: { type: string }
        volumeBinding: { type: string }
        default: { type: boolean }
        createdAt: { type: string, format: date-time }
    StorageClassDetail:
      allOf:
        - { $ref: "#/components/schemas/StorageClass" }
        - type: object
          required: [allowVolumeExpansion]
          properties:
            labels:
              type: object
              additionalProperties: { type: string }
            annotations:
              type: object
              additionalProperties: { type: string }
            parameters:
              type: object
              additionalProperties: { type: string }
            mountOptions:
              type: array
              items: { type: string }
            allowVolumeExpansion: { type: boolean }
    PersistentVolume:
      type: object
      required: [name, capacityBytes, accessModes, reclaimPolicy, status, storageClass, createdAt]
      properties:
        name: { type: string }
        capacityBytes: { type: integer, format: int64 }
        accessModes:
          type: array
          items: { type: string }
        reclaimPolicy: { type: string }
        status: { type: string }
        claim: { type: string }
        storageClass: { type: string }
        createdAt: { type: string, format: date-time }
    PersistentVolumeDetail:
      allOf:
        - { $ref: "#/components/schemas/PersistentVolume" }
        - type: object
          required: [volumeMode]
          properties:
            labels:
              type: object
              additionalProperties: { type: string }
            annotations:
              type: object
              additionalProperties: { type: string }
            volumeMode: { type: string }
            mountOptions:
              type: array
              items: { type: string }
            claimNamespace: { type: string }
            claimName: { type: string }
            csiDriver: { type: string }
    PersistentVolumeClaim:
      type: object
      required: [name, namespace, status, capacityBytes, accessModes, storageClass, createdAt]
      properties:
        name: { type: string }
        namespace: { type: string }
        resourceVersion: { type: string }
        status: { type: string }
        volumeName: { type: string }
        capacityBytes: { type: integer, format: int64 }
        accessModes:
          type: array
          items: { type: string }
        storageClass: { type: string }
        createdAt: { type: string, format: date-time }
    PersistentVolumeClaimDetail:
      allOf:
        - { $ref: "#/components/schemas/PersistentVolumeClaim" }
        - type: object
          required: [volumeMode, requestedCapacityBytes, conditions]
          properties:
            labels:
              type: object
              additionalProperties: { type: string }
            annotations:
              type: object
              additionalProperties: { type: string }
            volumeMode: { type: string }
            requestedCapacityBytes: { type: integer, format: int64 }
            conditions:
              type: array
              items: { $ref: "#/components/schemas/Condition" }
    PersistentVolumeClaimCreate:
      type: object
      required: [name, namespace, accessModes, requestedCapacityBytes]
      properties:
        name: { type: string }
        namespace: { type: string }
        storageClass: { type: string }
        accessModes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [ReadWriteOnce, ReadOnlyMany, ReadWriteMany, ReadWriteOncePod]
        requestedCapacityBytes: { type: integer, format: int64, minimum: 1, maximum: 1125899906842624 }
        volumeMode: { type: string, enum: [Filesystem, Block], default: Filesystem }
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
    PersistentVolumeClaimUpdate:
      type: object
      required: [requestedCapacityBytes]
      properties:
        requestedCapacityBytes: { type: integer, format: int64, minimum: 1, maximum: 1125899906842624 }
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        resourceVersion: { type: string }
    ResourceType:
      type: string
      enum: [node, namespace, pod, deployment, statefulset, daemonset, job, cronjob, service, ingress, configmap, secret, storageclass, persistentvolume, persistentvolumeclaim]
    YAMLResource:
      type: object
      required: [kind, name, yaml]
      properties:
        kind: { type: string }
        namespace: { type: string }
        name: { type: string }
        yaml: { type: string }

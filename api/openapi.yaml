        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/resilience/disruption-budgets/{namespace}/{name}:
    put:
      tags: [resilience]
      summary: Update a disruption budget using resourceVersion conflict protection
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisruptionBudgetInput" }
      responses:
        "200":
          description: Updated disruption budget
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisruptionBudgetSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    delete:
      tags: [resilience]
      summary: Delete a disruption budget with optional resourceVersion precondition
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/NamespacePath" }
        - { $ref: "#/components/parameters/Name" }
        - { name: resourceVersion, in: query, schema: { type: string, maxLength: 256 } }
      responses:
        "202":
          description: Disruption budget deletion accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/system/info:
    get:
      tags: [system]
      summary: Read Dosh build metadata and safe runtime configuration
      description: Returns no credentials, Secret values, or raw proxy authorization material.
      responses:
        "200":
          description: Dosh system information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/system/update:
    get:
      tags: [system]
      summary: Read the cached Dosh release update status
      responses:
        "200":
          description: Update check result, including disabled and error states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/system/update/check:
    post:
      tags: [system]
      summary: Force a Dosh release update check through the configured egress policy
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: Refreshed update check result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/system/egress:
    get:
      tags: [system]
      summary: Read the effective unified egress policy
      description: Returns proxy addresses and secret-presence flags without passwords or CA PEM.
      responses:
        "200":
          description: Effective egress settings and runtime override metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [system]
      summary: Apply and persist a runtime egress policy override
      description: Administrator-only. The change is persisted in a Kubernetes Secret and propagated to other replicas.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EgressSettingsUpdate" }
      responses:
        "200":
          description: Saved egress settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/system/egress/preflight:
    post:
      tags: [system]
      summary: Validate proxy targets and the current NetworkPolicy before saving
      description: Administrator-only. Resolves HTTP/HTTPS proxy hosts to exact IPs, checks current Helm-managed policy coverage, probes TCP reachability, and reports the CIDRs and ports that must be allowed.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EgressSettingsUpdate" }
      responses:
        "200":
          description: Proxy target and NetworkPolicy preflight result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressPreflight" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dosh_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Namespace:
      name: namespace
      in: query
      schema: { type: string }
    NamespacePath:
      name: namespace
      in: path
      required: true
      schema: { type: string }
    Search:
      name: q
      in: query
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200 }
    Cursor:
      name: cursor
      in: query
      description: Opaque continuation cursor returned in meta.nextCursor. Use it for the next page; do not construct or modify it.
      schema: { type: string, maxLength: 8192 }
    Sort:
      name: sort
      in: query
      description: Resource-specific sort field. Unsupported fields return 400.
      schema: { type: string }
    Order:
      name: order
      in: query
      description: Sort direction; requires sort.
      schema: { type: string, enum: [asc, desc], default: asc }
    ObjectKind:
      name: objectKind
      in: query
      description: Case-insensitive involved object kind filter for events.
      schema: { type: string }
    ObjectName:
      name: objectName
      in: query
      description: Involved object name filter for events.
      schema: { type: string }
    Kind:
      name: kind
      in: query
      schema: { $ref: "#/components/schemas/WorkloadKind" }
    WorkloadStatus:
      name: status
      in: query
      description: Case-insensitive workload status filter.
      schema: { type: string }
    KindPath:
      name: kind
      in: path
      required: true
      schema: { $ref: "#/components/schemas/WorkloadKind" }
    Name:
      name: name
      in: path
      required: true
      schema: { type: string }
    ResourceGroupPath:
      name: group
      in: path
      required: true
      description: Kubernetes API group, or `_core` for the core API group.
      schema: { type: string }
    ResourceVersionPath:
      name: version
      in: path
      required: true
      schema: { type: string }
    ResourceNamePath:
      name: resource
      in: path
      required: true
      description: Plural Kubernetes resource name, for example `pods` or `prometheuses`.
      schema: { type: string }
  responses:
    Session:
      description: Authenticated session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Permission or read-only mode denied the operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Resource version conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Login rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    DependencyUnavailable:
      description: Kubernetes API unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotSupported:
      description: Operation not supported for this resource kind
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
    ListMeta:
      type: object
      required: [total, totalKnown, page, pageSize, totalPages, hasMore]
      properties:
        total: { type: integer, minimum: 0 }
        totalKnown:
          type: boolean
          description: True when total is exact. False means the count is a lower bound for a filtered cursor scan.
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalPages: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.
        truncated:
          type: boolean
          description: True when a bounded event window or scan cap limited the result set.
        warnings:
          type: array
          items: { type: string }
        sort: { type: string }
        order: { type: string, enum: [asc, desc] }
        filters:
          type: object
          additionalProperties: { type: string }
        namespace: { type: string }
        search: { type: string }
        kind: { type: string }
        status: { type: string }
        columns:
          type: array
          description: Table API column definitions for type-aware generic resource lists.
          items: { $ref: "#/components/schemas/ResourceColumn" }
    OperationStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Actor:
      type: object
      required: [username, admin]
      properties:
        username: { type: string }
        groups:
          type: array
          items: { type: string }
        admin: { type: boolean }
    Capabilities:
      type: object
      required: [read, scale, restart, updateImage, suspendCronJob, delete, create, createService, updateService, deleteService, deleteNamespace, revealSecrets, editYAML, nodeCordon, nodeDrain, podExec, podEphemeralDebug, podPortForward, helmReleases, helmUpgrade, reloadCertificate]
      properties:
        read: { type: boolean }
        scale: { type: boolean }
        restart: { type: boolean }
        updateImage: { type: boolean }
        suspendCronJob: { type: boolean }
        delete: { type: boolean }
        create: { type: boolean }
        createService: { type: boolean }
        updateService: { type: boolean }
        deleteService: { type: boolean }
        deleteNamespace: { type: boolean }
        revealSecrets: { type: boolean }
        editYAML: { type: boolean }
        nodeCordon: { type: boolean }
        nodeDrain: { type: boolean }
        podExec: { type: boolean }
        podEphemeralDebug: { type: boolean }
        podPortForward: { type: boolean }
        helmReleases: { type: boolean }
        helmUpgrade: { type: boolean }
        reloadCertificate: { type: boolean }
        resourceActions:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ResourceCapabilities" }
    AccessReview:
      type: object
      required: [allowed, verb, resource, reason, guidance, kubectlCommand]
      properties:
        allowed: { type: boolean }
        verb: { type: string }
        apiGroup: { type: string }
        resource: { type: string }
        subresource: { type: string }
        namespace: { type: string }
        name: { type: string }
        reason: { type: string, enum: [allowed, read_only, rbac_denied, authorization_unavailable] }
        guidance: { type: string }
        kubectlCommand: { type: string }
    ResourceCapabilities:
      type: object
      required: [create, update, delete, scale]
      properties:
        create: { type: boolean }
        update: { type: boolean }
        delete: { type: boolean }
        scale: { type: boolean }
        riskLevel: { type: string, enum: [normal, high, critical] }
        riskReasons:
          type: array
          items: { type: string }
        requireConfirmation:
          type: boolean
          description: When true, real writes and deletes must include the resource name as confirmation.
    ServerCertificate:
      type: object
      required: [mode, enabled, configured, status, dnsNames, ipAddresses, daysRemaining, autoReload, reloadIntervalSeconds]
      properties:
        mode: { type: string, enum: [https, http] }
        enabled: { type: boolean }
        configured: { type: boolean }
        status: { type: string, enum: [valid, expiring, expired, not_yet_valid, disabled, unavailable] }
        subject: { type: string }
        issuer: { type: string }
        serialNumber: { type: string }
        dnsNames:
          type: array
          items: { type: string }
        ipAddresses:
          type: array
          items: { type: string }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        daysRemaining: { type: integer }
        fingerprintSha256: { type: string }
        keyAlgorithm: { type: string }
        autoReload: { type: boolean }
        reloadIntervalSeconds: { type: integer, minimum: 0 }
        lastReloadedAt: { type: string, format: date-time }
        lastReloadError: { type: string }
    Session:
      type: object
      required: [user, csrfToken, expiresAt, capabilities, authMode]
      properties:
        user: { $ref: "#/components/schemas/Actor" }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        authMode: { type: string, enum: [local, oidc, token] }
    AuthConfig:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [local, oidc, token] }
        providerName: { type: string }
    Condition:
      type: object
      required: [type, status]
      properties:
        type: { type: string }
        status: { type: string }
        reason: { type: string }
        message: { type: string }
        lastTransitionTime: { type: string, format: date-time }
    Event:
      type: object
      required: [uid, namespace, type, reason, message, objectKind, objectName, count, firstSeen, lastSeen]
      properties:
        uid: { type: string }
        namespace: { type: string }
        type: { type: string }
        reason: { type: string }
        message: { type: string }
        objectKind: { type: string }
        objectName: { type: string }
        count: { type: integer }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        source: { type: string }
    AuditRecord:
      type: object
      required: [id, timestamp, user, action, resource, result]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        timestamp: { type: string, format: date-time }
        user: { type: string }
        groups:
          type: array
          items: { type: string }
        action: { type: string }
        resource: { type: string }
        namespace: { type: string }
        name: { type: string }
        result: { type: string, enum: [success, failure, denied] }
        requestId: { type: string }
        error: { type: string }
        details:
          type: object
          additionalProperties: true
          description: Non-secret action metadata such as terminal duration and byte counts.
    AuditRecordList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditRecord" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    AuditActionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { type: string }
    AuditExport:
      type: object
      required: [exportedAt, count, items]
      properties:
        exportedAt: { type: string, format: date-time }
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditRecord" }
    ClusterNodeCIDR:
      type: object
      required: [name, podCIDRs]
      properties:
        name: { type: string }
        internalIP: { type: string }
        podCIDRs:
          type: array
          items: { type: string }
    ClusterConfiguration:
      type: object
      required: [name, version, nodeCIDRs]
      properties:
        name: { type: string }
        version: { type: string }
        platform: { type: string }
        cni: { type: string }
        controlPlaneEndpoint: { type: string }
        podCIDR: { type: string }
        serviceCIDR: { type: string }
        dnsDomain: { type: string }
        kubernetesServiceIP: { type: string }
        dnsServiceIP: { type: string }
        source: { type: string }
        nodeCIDRs:
          type: array
          items: { $ref: "#/components/schemas/ClusterNodeCIDR" }
        warnings:
          type: array
          items: { type: string }
    ClusterInfo:
      type: object
      required: [name, version, status, metricsAvailable]
      properties:
        name: { type: string }
        version: { type: string }
        platform: { type: string }
        cni: { type: string }
        status: { type: string }
        metricsAvailable: { type: boolean }
    OverviewCounts:
      type: object
      required: [nodes, readyNodes, pods, runningPods, workloads, namespaces, unhealthyPods, warningEvents]
      properties:
        nodes: { type: integer }
        readyNodes: { type: integer }
        pods: { type: integer }
        runningPods: { type: integer }
        workloads: { type: integer }
        namespaces: { type: integer }
        unhealthyPods: { type: integer }
        warningEvents: { type: integer }
    ClusterCapacity:
      type: object
      required: [cpuAllocatableMilli, memoryAllocatableBytes, podCapacity, cpuRequestsMilli, memoryRequestsBytes, cpuLimitsMilli, memoryLimitsBytes, cpuUsageMilli, memoryUsageBytes]
      properties:
        cpuAllocatableMilli: { type: integer, format: int64 }
        memoryAllocatableBytes: { type: integer, format: int64 }
        podCapacity: { type: integer, format: int64 }
        cpuRequestsMilli: { type: integer, format: int64 }
        memoryRequestsBytes: { type: integer, format: int64 }
        cpuLimitsMilli: { type: integer, format: int64 }
        memoryLimitsBytes: { type: integer, format: int64 }
        cpuUsageMilli: { type: integer, format: int64 }
        memoryUsageBytes: { type: integer, format: int64 }
    Overview:
      type: object
      required: [cluster, counts, capacity, recentEvents]
      properties:
        cluster: { $ref: "#/components/schemas/ClusterInfo" }
        counts: { $ref: "#/components/schemas/OverviewCounts" }
        capacity: { $ref: "#/components/schemas/ClusterCapacity" }
        recentEvents:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        warnings:
          type: array
          items: { type: string }
    NodeSummary:
      type: object
      required: [name, status, roles, internalIP, version, osImage, kernelVersion, containerRuntime, cpuCapacityMilli, memoryCapacityBytes, podCapacity, podCount, cpuRequestsMilli, memoryRequestsBytes, unschedulable, createdAt]
      properties:
        name: { type: string }
        status: { type: string }
        roles:
          type: array
          items: { type: string }
        internalIP: { type: string }
        version: { type: string }
        osImage: { type: string }
        kernelVersion: { type: string }
        containerRuntime: { type: string }
        cpuCapacityMilli: { type: integer, format: int64 }
        memoryCapacityBytes: { type: integer, format: int64 }
        podCapacity: { type: integer, format: int64 }
        podCount: { type: integer }
        cpuRequestsMilli: { type: integer, format: int64 }
        memoryRequestsBytes: { type: integer, format: int64 }
        cpuUsageMilli: { type: integer, format: int64 }
        memoryUsageBytes: { type: integer, format: int64 }
        hasMetrics: { type: boolean }
        unschedulable: { type: boolean }
        createdAt: { type: string, format: date-time }
    NodeDetail:
      allOf:
        - { $ref: "#/components/schemas/NodeSummary" }
        - type: object
          required: [resourceVersion, conditions, taints, labels, annotations, pods]
          properties:
            resourceVersion: { type: string }
            conditions:
              type: array
              items: { $ref: "#/components/schemas/Condition" }
            taints:
              type: array
              items: { $ref: "#/components/schemas/Taint" }
            labels:
              type: object
              additionalProperties: { type: string }
            annotations:
              type: object
              additionalProperties: { type: string }
            pods:
              type: array
              items: { $ref: "#/components/schemas/PodSummary" }
    Taint:
      type: object
      required: [key, effect]
      properties:
        key: { type: string }
        value: { type: string }
        effect: { type: string, enum: [NoSchedule, PreferNoSchedule, NoExecute] }
        timeAdded: { type: string }
    NodeLabelUpdate:
      type: object
      required: [labels]
      properties:
        labels:
          type: object
          additionalProperties: { type: string }
        resourceVersion: { type: string }
    NodeTaintUpdate:
      type: object
      required: [taints]
      properties:
        taints:
          type: array
          items: { $ref: "#/components/schemas/Taint" }
        resourceVersion: { type: string }
    NodeDrainOptions:
      type: object
      required: [ignoreDaemonSets, force, timeoutSeconds, confirmation]
      properties:
        ignoreDaemonSets: { type: boolean }
        force: { type: boolean }
        timeoutSeconds: { type: integer, minimum: 0, maximum: 300 }
        confirmation: { type: string }
    NodeDrainPod:
      type: object
      required: [name, namespace, status, action]
      properties:
        name: { type: string }
        namespace: { type: string }
        status: { type: string }
        ownerKind: { type: string }
        ownerName: { type: string }
        action: { type: string, enum: [evict, skip, block, blocked, failed, remaining] }
        reason: { type: string }
        pdbNames:
          type: array
          items: { type: string }
        evictionError: { type: string }
    NodeDrainPlan:
      type: object
      required: [node, unschedulable, pods, evictCount, skippedCount]
      properties:
        node: { type: string }
        unschedulable: { type: boolean }
        pods:
          type: array
          items: { $ref: "#/components/schemas/NodeDrainPod" }
        evictCount: { type: integer }
        skippedCount: { type: integer }
        warnings:
          type: array
          items: { type: string }
    NodeDrainResult:
      type: object
      required: [node, cordoned, pods, evictedCount, blockedCount, failedCount, skippedCount]
      properties:
        node: { type: string }
        cordoned: { type: boolean }
        pods:
          type: array
          items: { $ref: "#/components/schemas/NodeDrainPod" }
        evictedCount: { type: integer }
        blockedCount: { type: integer }
        failedCount: { type: integer }
        skippedCount: { type: integer }
        warnings:
          type: array
          items: { type: string }
    Namespace:
      type: object
      required: [name, status, createdAt]
      properties:
        name: { type: string }
        status: { type: string }
        resourceVersion: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
    NamespaceCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
    NamespaceDetail:
      allOf:
        - { $ref: "#/components/schemas/Namespace" }
        - type: object
          required: [resourceQuotas, limitRanges]
          properties:
            resourceQuotas:
              type: array
              items: { $ref: "#/components/schemas/ResourceQuota" }
            limitRanges:
              type: array
              items: { $ref: "#/components/schemas/LimitRange" }
    ResourceQuota:
      type: object
      required: [name, hard, used, createdAt]
      properties:
        name: { type: string }
        hard:
          type: object
          additionalProperties: { type: string }
        used:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
    LimitRange:
      type: object
      required: [name, limits, createdAt]
      properties:
        name: { type: string }
        limits:
          type: array
          items: { $ref: "#/components/schemas/LimitRangeItem" }
        createdAt: { type: string, format: date-time }
    LimitRangeItem:
      type: object
      required: [type, min, max, default, defaultRequest]
      properties:
        type: { type: string }
        min:
          type: object
          additionalProperties: { type: string }
        max:
          type: object
          additionalProperties: { type: string }
        default:
          type: object
          additionalProperties: { type: string }
        defaultRequest:
          type: object
          additionalProperties: { type: string }
    WorkloadKind:
      type: string
      enum: [deployment, statefulset, daemonset, job, cronjob]
    WorkloadSummary:
      type: object
      required: [kind, name, namespace, status, ready, desired, restarts, images, createdAt]
      properties:
        kind: { type: string }
        name: { type: string }
        namespace: { type: string }
        resourceVersion: { type: string }
        status: { type: string }
        ready: { type: string }
        desired: { type: integer }
        restarts: { type: integer }
        images:
          type: array
          items: { type: string }
        template:
          type: string
          description: Read-only pod template YAML used for rollback preview and targeted patch.
        createdAt: { type: string, format: date-time }
        labels:
          type: object
          additionalProperties: { type: string }
    WorkloadRevision:
      type: object
      required: [kind, name, revision, current, status, replicas, readyReplicas, images, createdAt]
      properties:
        kind: { type: string, enum: [Deployment, StatefulSet] }
        name: { type: string }
        revision: { type: integer, format: int64 }
        current: { type: boolean }
        changeCause: { type: string }
        status: { type: string }
        replicas: { type: integer }
        readyReplicas: { type: integer }
        images:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    DeploymentEnvVar:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }
    WorkloadCreateRequest:
      type: object
      required: [name, namespace]
      properties:
        kind:
          type: string
          enum: [deployment, statefulset, daemonset, job, cronjob]
          description: Optional on the legacy Deployment-only endpoint; required by WorkloadCreateKindRequest.
        name: { type: string, minLength: 1, maxLength: 63 }
        namespace: { type: string, minLength: 1, maxLength: 63 }
        replicas: { type: integer, minimum: 0, maximum: 1000 }
        serviceName: { type: string, maxLength: 63, description: Required for StatefulSet; defaults to the workload name. }
        schedule: { type: string, maxLength: 100, description: Required for CronJob. }
        concurrencyPolicy: { type: string, enum: [Allow, Forbid, Replace], default: Allow }
        suspend: { type: boolean, default: false }
        containerName: { type: string, maxLength: 63 }
        image: { type: string, minLength: 1, maxLength: 512 }
        registryId: { type: string, maxLength: 128 }
        containerPort: { type: integer, minimum: 1, maximum: 65535 }
        cpuRequestMilli: { type: integer, minimum: 0, maximum: 128000 }
        cpuLimitMilli: { type: integer, minimum: 0, maximum: 128000 }
        memoryRequestBytes: { type: integer, minimum: 0, maximum: 1099511627776 }
        memoryLimitBytes: { type: integer, minimum: 0, maximum: 1099511627776 }
        env:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/WorkloadEnvVar" }
        imagePullSecrets:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 253 }
        volumes:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/WorkloadVolumeSpec" }
        containers:
          type: array
          maxItems: 32
          description: Preferred application-container list. Legacy image/containerPort fields are converted to one container when omitted.
          items: { $ref: "#/components/schemas/WorkloadContainerSpec" }
        initContainers:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/WorkloadContainerSpec" }
        command:
          type: array
          maxItems: 128
          items: { type: string, maxLength: 4096 }
        args:
          type: array
          maxItems: 128
          items: { type: string, maxLength: 4096 }
        nodeSelector:
          type: object
          maxProperties: 32
          additionalProperties: { type: string }
        tolerations:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/WorkloadToleration" }
        nodeAffinity:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/WorkloadNodeSelectorRequirement" }
        topologySpreadConstraints:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/WorkloadTopologySpreadConstraint" }
        priorityClassName: { type: string, maxLength: 63 }
        serviceAccountName: { type: string, maxLength: 63 }
        podSecurityContext: { $ref: "#/components/schemas/WorkloadPodSecurityContext" }
        runtimeClassName: { type: string, maxLength: 253, description: Optional RuntimeClass for the Pod template. }
        terminationGracePeriodSeconds: { type: integer, format: int64, minimum: 0, maximum: 86400 }
        jobCompletions: { type: integer, minimum: 1, maximum: 10000 }
        jobParallelism: { type: integer, minimum: 0, maximum: 10000 }
        jobBackoffLimit: { type: integer, minimum: 0, maximum: 10000 }
        jobActiveDeadlineSeconds: { type: integer, format: int64, minimum: 1, maximum: 604800 }
        jobTtlSecondsAfterFinished: { type: integer, minimum: 0, maximum: 2592000 }
        labels:
          type: object
          maxProperties: 32
          additionalProperties: { type: string }
    WorkloadContainerSpec:
      type: object
      required: [image]
      properties:
        name: { type: string, maxLength: 63 }
        image: { type: string, minLength: 1, maxLength: 512 }
        registryId: { type: string, maxLength: 128 }
        containerPort: { type: integer, minimum: 0, maximum: 65535 }
        cpuRequestMilli: { type: integer, minimum: 0, maximum: 128000 }
        cpuLimitMilli: { type: integer, minimum: 0, maximum: 128000 }
        memoryRequestBytes: { type: integer, minimum: 0, maximum: 1099511627776 }
        memoryLimitBytes: { type: integer, minimum: 0, maximum: 1099511627776 }
        env:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/WorkloadEnvVar" }
        command:
          type: array
          maxItems: 128
          items: { type: string, maxLength: 4096 }
        args:
          type: array
          maxItems: 128
          items: { type: string, maxLength: 4096 }
        securityContext: { $ref: "#/components/schemas/WorkloadContainerSecurityContext" }
        volumeMounts:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/WorkloadVolumeMount" }
        livenessProbe: { $ref: "#/components/schemas/WorkloadProbe" }
        readinessProbe: { $ref: "#/components/schemas/WorkloadProbe" }
        startupProbe: { $ref: "#/components/schemas/WorkloadProbe" }
    WorkloadVolumeSpec:
      type: object
      required: [name, type, source]
      properties:
        name: { type: string, maxLength: 63 }
        type: { type: string, enum: [configMap, secret, persistentVolumeClaim] }
        source: { type: string, maxLength: 253 }
        optional: { type: boolean, description: Only valid for ConfigMap and Secret sources. }
    WorkloadToleration:
      type: object
      properties:
        key: { type: string }
        operator: { type: string, enum: [Equal, Exists] }
        value: { type: string }
        effect: { type: string, enum: ["", NoSchedule, PreferNoSchedule, NoExecute] }
        tolerationSeconds: { type: integer, format: int64, minimum: 0 }
    WorkloadNodeSelectorRequirement:
      type: object
      required: [key, operator]
      properties:
        key: { type: string }
        operator: { type: string, enum: [In, NotIn, Exists, DoesNotExist] }
        values:
          type: array
          items: { type: string }
    WorkloadTopologySpreadConstraint:
      type: object
      required: [maxSkew, topologyKey, whenUnsatisfiable]
      properties:
        maxSkew: { type: integer, minimum: 1, maximum: 100 }
        topologyKey: { type: string }
        whenUnsatisfiable: { type: string, enum: [DoNotSchedule, ScheduleAnyway] }
    WorkloadPodSecurityContext:
      type: object
      properties:
        runAsUser: { type: integer, format: int64, minimum: 0 }
        runAsGroup: { type: integer, format: int64, minimum: 0 }
        fsGroup: { type: integer, format: int64, minimum: 0 }
        runAsNonRoot: { type: boolean }
        seccompProfile: { type: string, enum: [RuntimeDefault, Localhost, Unconfined] }
    WorkloadContainerSecurityContext:
      type: object
      properties:
        runAsUser: { type: integer, format: int64, minimum: 0 }
        runAsGroup: { type: integer, format: int64, minimum: 0 }
        runAsNonRoot: { type: boolean }
        readOnlyRootFilesystem: { type: boolean }
        allowPrivilegeEscalation: { type: boolean }
        capabilitiesAdd:
          type: array
          items: { type: string }
        capabilitiesDrop:
          type: array
          items: { type: string }
    CronJobRunRequest:
      type: object
      properties:
        containerName: { type: string, maxLength: 63 }
        command:
          type: array
          maxItems: 128
          items: { type: string, maxLength: 4096 }
        args:
          type: array
          maxItems: 128
          items: { type: string, maxLength: 4096 }
    WorkloadRolloutUpdate:
      type: object
      properties:
        paused: { type: boolean }
        maxSurge: { type: string, pattern: '^([0-9]+)(%?)$' }
        maxUnavailable: { type: string, pattern: '^([0-9]+)(%?)$' }
        partition: { type: integer, format: int32, minimum: 0, maximum: 100000, description: StatefulSet only. Zero updates all replicas. }
        resourceVersion: { type: string, maxLength: 256 }
    WorkloadCreateKindRequest:
      allOf:
        - { $ref: "#/components/schemas/WorkloadCreateRequest" }
        - type: object
          required: [kind]
    DeploymentPreview:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string }
    WorkloadDetail:
      allOf:
        - { $ref: "#/components/schemas/WorkloadSummary" }
        - type: object
          required: [conditions, selector, pods, volumes, containers]
          properties:
            conditions:
              type: array
              items: { $ref: "#/components/schemas/Condition" }
            selector:
              type: object
              additionalProperties: { type: string }
            pods:
              type: array
              items: { $ref: "#/components/schemas/PodSummary" }
            volumes:
              type: array
              items: { $ref: "#/components/schemas/WorkloadVolume" }
            containers:
              type: array
              items: { $ref: "#/components/schemas/WorkloadContainer" }
            initContainers:
              type: array
              items: { $ref: "#/components/schemas/WorkloadContainer" }
            rollout: { $ref: "#/components/schemas/WorkloadRolloutStatus" }
            replicaSets:
              type: array
              items: { $ref: "#/components/schemas/WorkloadReplicaSet" }
            batch: { $ref: "#/components/schemas/WorkloadBatchStatus" }
    WorkloadRolloutStatus:
      type: object
      required: [paused, strategy, observedGeneration, updatedReplicas, readyReplicas, availableReplicas, unavailableReplicas]
      properties:
        paused: { type: boolean }
        strategy: { type: string }
        maxSurge: { type: string }
        maxUnavailable: { type: string }
        partition: { type: integer }
        observedGeneration: { type: integer, format: int64 }
        updatedReplicas: { type: integer }
        readyReplicas: { type: integer }
        availableReplicas: { type: integer }
        unavailableReplicas: { type: integer }
    WorkloadReplicaSet:
      type: object
      required: [name, revision, current, desired, ready, available, images, createdAt]
      properties:
        name: { type: string }
        revision: { type: integer, format: int64 }
        current: { type: boolean }
        desired: { type: integer }
        ready: { type: integer }
        available: { type: integer }
        images:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    WorkloadBatchStatus:
      type: object
      required: [active, succeeded, failed]
      properties:
        active: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        completions: { type: integer }
        parallelism: { type: integer }
        backoffLimit: { type: integer }
        activeDeadlineSeconds: { type: integer, format: int64 }
        ttlSecondsAfterFinished: { type: integer }
        lastScheduleTime: { type: string, format: date-time }
        lastSuccessfulTime: { type: string, format: date-time }
        failureReason: { type: string }
        failureMessage: { type: string }
        activeJobs:
          type: array
          items: { $ref: "#/components/schemas/WorkloadActiveJob" }
    WorkloadActiveJob:
      type: object
      required: [name, status, succeeded, failed]
      properties:
        name: { type: string }
        status: { type: string }
        succeeded: { type: integer }
        failed: { type: integer }
        startTime: { type: string, format: date-time }
        completionTime: { type: string, format: date-time }
    WorkloadContainer:
      type: object
      required: [name, image, ports, resources, env, volumeMounts]
      properties:
        name: { type: string }
        image: { type: string }
        ports:
          type: array
          items: { $ref: "#/components/schemas/WorkloadContainerPort" }
        resources: { $ref: "#/components/schemas/WorkloadContainerResources" }
        env:
          type: array
          items: { $ref: "#/components/schemas/WorkloadEnvVar" }
        volumeMounts:
          type: array
          items: { $ref: "#/components/schemas/WorkloadVolumeMount" }
        livenessProbe: { $ref: "#/components/schemas/WorkloadProbe" }
        readinessProbe: { $ref: "#/components/schemas/WorkloadProbe" }
        startupProbe: { $ref: "#/components/schemas/WorkloadProbe" }
    WorkloadContainerPort:
      type: object
      required: [containerPort, protocol]
      properties:
        name: { type: string }
        containerPort: { type: integer }
        protocol: { type: string }
    WorkloadContainerResources:
      type: object
      required: [cpuRequestMilli, cpuLimitMilli, memoryRequestBytes, memoryLimitBytes]
      properties:
        cpuRequestMilli: { type: integer, format: int64 }
        cpuLimitMilli: { type: integer, format: int64 }
        memoryRequestBytes: { type: integer, format: int64 }
        memoryLimitBytes: { type: integer, format: int64 }
    WorkloadEnvVar:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }
        valueFrom: { $ref: "#/components/schemas/WorkloadEnvValueFrom" }
    WorkloadEnvValueFrom:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [configMapKeyRef, secretKeyRef, fieldRef, resourceFieldRef]
        name: { type: string }
        key: { type: string }
        optional: { type: boolean }
    WorkloadVolumeMount:
      type: object
      required: [name, mountPath, readOnly]
      properties:
        name: { type: string }
        mountPath: { type: string }
        subPath: { type: string }
        readOnly: { type: boolean }
    WorkloadVolume:
      type: object
      required: [name, type, source, readOnly]
      properties:
        name: { type: string }
        type: { type: string }
        source: { type: string }
        readOnly: { type: boolean }
    WorkloadProbe:
      type: object
      required: [type, command, initialDelaySeconds, periodSeconds, timeoutSeconds, successThreshold, failureThreshold]
      properties:
        type:
          type: string
          enum: [httpGet, tcpSocket, exec, grpc]
        path: { type: string }
        host: { type: string }
        scheme: { type: string, enum: [HTTP, HTTPS] }
        port: { type: string }
        service: { type: string }
        command:
          type: array
          items: { type: string }
        initialDelaySeconds: { type: integer }
        periodSeconds: { type: integer }
        timeoutSeconds: { type: integer }
        successThreshold: { type: integer }
        failureThreshold: { type: integer }
    WorkloadContainerConfigUpdate:
      type: object
      required: [env, volumeMounts]
      properties:
        env:
          type: array
          maxItems: 128
          items: { $ref: "#/components/schemas/WorkloadEnvVar" }
        volumeMounts:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/WorkloadVolumeMount" }
        livenessProbe: { $ref: "#/components/schemas/WorkloadProbe" }
        readinessProbe: { $ref: "#/components/schemas/WorkloadProbe" }
        startupProbe: { $ref: "#/components/schemas/WorkloadProbe" }
        resourceVersion: { type: string, maxLength: 256 }
    AutoscalerMetric:
      type: object
      required: [type]
      properties:
        type: { type: string }
        resource: { type: string }
        current: { type: string }
        target: { type: string }
        currentUtilization: { type: integer, format: int32 }
        targetUtilization: { type: integer, format: int32 }
    AutoscalerSummary:
      type: object
      required: [name, namespace, targetKind, targetName, minReplicas, maxReplicas, currentReplicas, desiredReplicas, status, metrics, conditions, createdAt]
      properties:
        name: { type: string }
        namespace: { type: string }
        resourceVersion: { type: string }
        targetKind: { type: string, enum: [Deployment, StatefulSet] }
        targetName: { type: string }
        minReplicas: { type: integer, format: int32 }
        maxReplicas: { type: integer, format: int32 }
        currentReplicas: { type: integer, format: int32 }
        desiredReplicas: { type: integer, format: int32 }
        status: { type: string, enum: [Ready, Scaling, Idle, Degraded] }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/AutoscalerMetric" }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/Condition" }
        lastScaleTime: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    AutoscalerInput:
      type: object
      required: [name, namespace, targetKind, targetName, minReplicas, maxReplicas]
      description: At least one of cpuUtilization and memoryUtilization is required.
      properties:
        name: { type: string, maxLength: 63 }
        namespace: { type: string, maxLength: 63 }
        targetKind: { type: string, enum: [Deployment, StatefulSet] }
        targetName: { type: string, maxLength: 63 }
        minReplicas: { type: integer, format: int32, minimum: 1, maximum: 1000 }
        maxReplicas: { type: integer, format: int32, minimum: 1, maximum: 1000 }
        cpuUtilization: { type: integer, format: int32, minimum: 1, maximum: 100, description: Target average CPU utilization percentage. }
        memoryUtilization: { type: integer, format: int32, minimum: 1, maximum: 100, description: Target average memory utilization percentage. }
        resourceVersion: { type: string, maxLength: 256 }
    DisruptionBudgetSummary:
      type: object
      required: [name, namespace, selector, currentHealthy, desiredHealthy, disruptionsAllowed, expectedPods, observedGeneration, status, conditions, createdAt]
      properties:
        name: { type: string }
        namespace: { type: string }
        resourceVersion: { type: string }
        minAvailable: { type: string }
        maxUnavailable: { type: string }
        selector:
          type: object
          additionalProperties: { type: string }
        currentHealthy: { type: integer, format: int32 }
        desiredHealthy: { type: integer, format: int32 }
        disruptionsAllowed: { type: integer, format: int32 }
        expectedPods: { type: integer, format: int32 }
        observedGeneration: { type: integer, format: int64 }
        status: { type: string, enum: [Ready, Protected, Blocked] }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/Condition" }
        createdAt: { type: string, format: date-time }
    DisruptionBudgetInput:
      type: object
      required: [name, namespace, selector]
      description: Exactly one of minAvailable and maxUnavailable is required.
      properties:
        name: { type: string, maxLength: 63 }
        namespace: { type: string, maxLength: 63 }
        minAvailable: { type: string, pattern: '^([0-9]+)(%?)$' }
        maxUnavailable: { type: string, pattern: '^([0-9]+)(%?)$' }
        selector:
          type: object
          minProperties: 1
          maxProperties: 16
          additionalProperties: { type: string }
        resourceVersion: { type: string, maxLength: 256 }
    PodSummary:
      type: object
      required: [name, namespace, status, ready, restarts, ip, node, createdAt]
      properties:
        name: { type: string }
        namespace: { type: string }
        status: { type: string }
        ready: { type: string }
        restarts: { type: integer }
        ip: { type: string }
        node: { type: string }
        ownerKind: { type: string }
        ownerName: { type: string }
        createdAt: { type: string, format: date-time }
        cpuUsageMilli: { type: integer, format: int64 }
        memoryUsageBytes: { type: integer, format: int64 }
        hasMetrics: { type: boolean }
        labels:
          type: object
          additionalProperties: { type: string }
    Container:
      type: object
      required: [name, image, ready, restartCount, state, cpuRequestMilli, cpuLimitMilli, memoryRequestBytes, memoryLimitBytes]
      properties:
        name: { type: string }
        image: { type: string }
        ports:
          type: array
          items: { $ref: "#/components/schemas/ContainerPort" }
        init: { type: boolean }
        ephemeral: { type: boolean }
        ready: { type: boolean }
        restartCount: { type: integer }
        state: { type: string }
        reason: { type: string }
        cpuRequestMilli: { type: integer, format: int64 }
        cpuLimitMilli: { type: integer, format: int64 }
        memoryRequestBytes: { type: integer, format: int64 }
        memoryLimitBytes: { type: integer, format: int64 }
    ContainerPort:
      type: object
      required: [protocol, port]
      properties:
        name: { type: string }
        protocol: { type: string, enum: [TCP, UDP, SCTP] }
        port: { type: integer, minimum: 1, maximum: 65535 }
    PortForwardRequest:
      type: object
      required: [port]
      properties:
        port: { type: integer, minimum: 1, maximum: 65535 }
    PortForwardSession:
      type: object
      required: [id, namespace, pod, port, path, expiresAt]
      properties:
        id: { type: string }
        namespace: { type: string }
        pod: { type: string }
        service: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        path: { type: string }
        expiresAt: { type: string, format: date-time }
    PodEphemeralContainerCreate:
      type: object
      required: [image]
      properties:
        image:
          type: string
          maxLength: 512
          description: Container image that contains the selected shell.
        targetContainerName:
          type: string
          maxLength: 253
          description: Optional existing application or Init Container whose process namespace is shared.
        shell:
          type: string
          enum: [sh, bash, ash]
          default: sh
    PodEphemeralContainerResult:
      type: object
      required: [name, status]
      properties:
        name: { type: string }
        status: { type: string, enum: [created] }
    PodDetail:
      allOf:
        - { $ref: "#/components/schemas/PodSummary" }
        - type: object
          required: [containers, conditions, qosClass, serviceAccount]
          properties:
            containers:
              type: array
              items: { $ref: "#/components/schemas/Container" }
            conditions:
              type: array
              items: { $ref: "#/components/schemas/Condition" }
            qosClass: { type: string }
            serviceAccount: { type: string }
    HelmReleaseSummary:
      type: object
      required: [name, namespace, chart, chartVersion, revision, status]
      properties:
        name: { type: string }
        namespace: { type: string }
        chart: { type: string }
        chartVersion: { type: string }
        appVersion: { type: string }
        revision: { type: integer }
        status: { type: string }
        description: { type: string }
        updatedAt: { type: string, format: date-time }
    HelmReleaseDetail:
      allOf:
        - { $ref: "#/components/schemas/HelmReleaseSummary" }
        - type: object
          required: [values, manifest, history]
          properties:
            firstDeployed: { type: string, format: date-time }
            lastDeployed: { type: string, format: date-time }
            notes: { type: string }
            values:
              type: string
              description: Redacted YAML values.
            manifest:
              type: string
              description: Redacted rendered manifest. Secret data and stringData are always masked.
            history:
              type: array
              items: { $ref: "#/components/schemas/HelmReleaseSummary" }
            warnings:
              type: array
              items: { type: string }
    HelmReleaseDiff:
      type: object
      required: [namespace, name, from, to, valuesDiff, manifestDiff]
      properties:
        namespace: { type: string }
        name: { type: string }
        from: { $ref: "#/components/schemas/HelmReleaseSummary" }
        to: { $ref: "#/components/schemas/HelmReleaseSummary" }
        valuesDiff:
          type: string
          description: Unified diff after sensitive values are redacted.
        manifestDiff:
          type: string
          description: Unified diff after Secret data and sensitive manifest fields are redacted.
        warnings:
          type: array
          items: { type: string }
    HelmReleaseRollbackRequest:
      type: object
      required: [targetRevision, confirmation]
      properties:
        targetRevision: { type: integer, minimum: 1 }
        confirmation:
          type: string
          description: Must exactly equal the Helm release name.
    HelmReleaseRollbackResult:
      type: object
      required: [namespace, name, targetRevision, revision, appliedObjects]
      properties:
        namespace: { type: string }
        name: { type: string }
        targetRevision: { type: integer }
        revision: { type: integer }
        appliedObjects: { type: integer, minimum: 0 }
        warnings:
          type: array
          items: { type: string }
    HelmReleaseUpgradeRequest:
      type: object
      properties:
        values:
          type: string
          maxLength: 1048576
          description: Optional YAML override merged over the server-side current values.
        confirmation:
          type: string
          description: Required for the apply endpoint; must exactly equal the release name.
    HelmReleaseUpgradePreview:
      type: object
      required: [namespace, name, currentRevision, nextRevision, valuesDiff, manifestDiff]
      properties:
        namespace: { type: string }
        name: { type: string }
        currentRevision: { type: integer, minimum: 1 }
        nextRevision: { type: integer, minimum: 2 }
        valuesDiff:
          type: string
          description: Unified diff after sensitive values are redacted.
        manifestDiff:
          type: string
          description: Unified diff after Secret data and sensitive manifest fields are redacted.
        warnings:
          type: array
          items: { type: string }
    HelmReleaseUpgradeResult:
      type: object
      required: [namespace, name, previousRevision, revision, appliedObjects]
      properties:
        namespace: { type: string }
        name: { type: string }
        previousRevision: { type: integer, minimum: 1 }
        revision: { type: integer, minimum: 2 }
        appliedObjects: { type: integer, minimum: 0 }
        warnings:
          type: array
          items: { type: string }
    HelmRepository:
      type: object
      description: An administrator-managed Helm repository. HTTP/HTTPS repositories expose index.yaml; OCI repositories point at one Chart repository path.
      required: [id, name, url, default, enabled, chartCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        url:
          type: string
          format: uri
          description: HTTP/HTTPS index URL or an oci:// URL pointing to a single Chart path. The protocol is inferred from this value.
        description: { type: string }
        default: { type: boolean }
        enabled: { type: boolean }
        insecureSkipTLSVerify: { type: boolean }
        authType: { type: string, enum: [anonymous, basic, bearer] }
        hasCredentials: { type: boolean }
        hasCustomCA: { type: boolean }
        lastSync: { $ref: "#/components/schemas/HelmRepositorySync" }
        chartCount: { type: integer, minimum: 0 }
        revision: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    HelmRepositorySync:
      type: object
      required: [ok, message, chartCount, syncedAt]
      properties:
        ok: { type: boolean }
        message: { type: string }
        chartCount: { type: integer, minimum: 0 }
        syncedAt: { type: string, format: date-time }
    HelmRepositoryUpsert:
      type: object
      required: [name, url]
      properties:
        name: { type: string, maxLength: 128 }
        url:
          type: string
          format: uri
          maxLength: 2048
          description: HTTP/HTTPS repository root serving index.yaml, or an oci://registry/path/chart reference without a tag.
          examples:
            - https://charts.example.com
            - oci://registry.example.com/team/charts/nginx
        description: { type: string }
        default: { type: boolean }
        enabled: { type: boolean }
        insecureSkipTLSVerify: { type: boolean }
        authType: { type: string, enum: [anonymous, basic, bearer] }
        username: { type: string }
        password: { type: string, format: password }
        token: { type: string, format: password }
        caPEM: { type: string }
        clearCredentials: { type: boolean }
        revision: { type: string }
    HelmChartSummary:
      type: object
      required: [repositoryId, repositoryName, name, version, deprecated]
      properties:
        repositoryId: { type: string }
        repositoryName: { type: string }
        name: { type: string }
        version: { type: string }
        appVersion: { type: string }
        description: { type: string }
        icon: { type: string }
        deprecated: { type: boolean }
        digest:
          type: string
          description: SHA-256 of the Chart package. For OCI repositories this is the Chart layer digest.
        createdAt: { type: string, format: date-time }
        keywords:
          type: array
          items: { type: string }
    HelmChartVersion:
      type: object
      required: [version, deprecated]
      properties:
        version: { type: string }
        appVersion: { type: string }
        digest:
          type: string
          description: Version-specific package digest when available. OCI details populate the latest version digest after pulling its Chart layer.
        createdAt: { type: string, format: date-time }
        deprecated: { type: boolean }
        urls:
          type: array
          items: { type: string }
    HelmChartDetail:
      allOf:
        - { $ref: "#/components/schemas/HelmChartSummary" }
        - type: object
          required: [values, versions]
          properties:
            home: { type: string }
            sources:
              type: array
              items: { type: string }
            maintainers:
              type: array
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  email: { type: string }
                  url: { type: string }
            readme: { type: string }
            values: { type: string }
            schema:
              type: string
              description: values.schema.json packaged in the Chart. Dosh validates merged values against it while planning install or upgrade.
            dependencies:
              type: array
              items:
                type: object
                required: [name, version]
                properties:
                  name: { type: string }
                  version: { type: string }
                  repository: { type: string }
                  condition: { type: string }
                  alias: { type: string }
            versions:
              type: array
              items: { $ref: "#/components/schemas/HelmChartVersion" }
            warnings:
              type: array
              items: { type: string }
    HelmChartPlanRequest:
      type: object
      required: [repositoryId, chartName, version, mode, namespace, releaseName]
      properties:
        repositoryId: { type: string, maxLength: 128 }
        chartName: { type: string, maxLength: 253 }
        version: { type: string, maxLength: 128 }
        digest: { type: string }
        mode: { type: string, enum: [install, upgrade] }
        namespace: { type: string, maxLength: 63 }
        releaseName: { type: string, maxLength: 53 }
        values: { type: string, maxLength: 1048576 }
    HelmChartPlanResource:
      type: object
      required: [apiVersion, kind, name, hook, crd, action, resource, exists]
      properties:
        apiVersion: { type: string }
        kind: { type: string }
        namespace: { type: string }
        name: { type: string }
        hook: { type: boolean }
        crd: { type: boolean }
        action: { type: string, enum: [create, update] }
        apiGroup: { type: string }
        resource: { type: string }
        exists: { type: boolean }
    HelmChartPlan:
      type: object
      required: [action, repositoryId, repositoryName, chartName, chartVersion, digest, namespace, releaseName, values, resources, hookCount, crdCount, planDigest]
      properties:
        action: { type: string, enum: [install, upgrade] }
        repositoryId: { type: string }
        repositoryName: { type: string }
        chartName: { type: string }
        chartVersion: { type: string }
        appVersion: { type: string }
        digest: { type: string }
        namespace: { type: string }
        releaseName: { type: string }
        currentRevision: { type: integer, minimum: 0 }
        manifest: { type: string }
        values: { type: string }
        resources:
          type: array
          items: { $ref: "#/components/schemas/HelmChartPlanResource" }
        hookCount: { type: integer, minimum: 0 }
        crdCount: { type: integer, minimum: 0 }
        warnings:
          type: array
          items: { type: string }
        planDigest: { type: string }
    HelmChartOperationRequest:
      allOf:
        - { $ref: "#/components/schemas/HelmChartPlanRequest" }
        - type: object
          required: [planDigest, confirmation]
          properties:
            planDigest: { type: string }
            confirmation: { type: string }
    HelmChartUninstallRequest:
      type: object
      required: [namespace, releaseName, confirmation]
      properties:
        namespace: { type: string, maxLength: 63 }
        releaseName: { type: string, maxLength: 53 }
        confirmation: { type: string }
    HelmChartRollbackRequest:
      type: object
      required: [namespace, releaseName, targetRevision, confirmation]
      properties:
        namespace: { type: string, maxLength: 63 }
        releaseName: { type: string, maxLength: 53 }
        targetRevision: { type: integer, minimum: 1 }
        confirmation: { type: string }
    HelmChartOperation:
      type: object
      required: [id, type, status, namespace, releaseName, startedAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [install, upgrade, uninstall, rollback] }
        status: { type: string, enum: [pending, running, success, failed] }
        message: { type: string }
        repositoryId: { type: string }
        chartName: { type: string }
        chartVersion: { type: string }
        digest: { type: string }
        namespace: { type: string }
        releaseName: { type: string }
        revision: { type: integer }
        resources:
          type: array
          description: Live status for each resource represented by the reviewed Helm plan.
          items: { $ref: "#/components/schemas/HelmOperationResource" }
        warnings:
          type: array
          items: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    HelmOperationResource:
      type: object
      required: [apiVersion, kind, name, hook, crd, action, resource, status]
      properties:
        apiVersion: { type: string }
        kind: { type: string }
        namespace: { type: string }
        name: { type: string }
        hook: { type: boolean }
        crd: { type: boolean }
        action: { type: string, enum: [create, update] }
        apiGroup: { type: string }
        resource: { type: string }
        status: { type: string, enum: [pending, waiting, ready, failed, created, unknown] }
        message: { type: string }
    ServicePort:
      type: object
      required: [protocol, port, targetPort]
      properties:
        name: { type: string }
        protocol: { type: string }
        port: { type: integer }
        targetPort: { type: string }
        nodePort: { type: integer }
    ServiceSummary:
      type: object
      required: [name, namespace, type, headless, clusterIP, externalIP, ports, endpointCount, createdAt]
      properties:
        name: { type: string }
        namespace: { type: string }
        resourceVersion: { type: string }
        type: { type: string }
        headless:
          type: boolean
          description: True when the Service has clusterIP None and DNS returns Pod addresses directly.
        clusterIP: { type: string }
        externalIP: { type: string }
        ports:
          type: array
          items: { $ref: "#/components/schemas/ServicePort" }
        selector:
          type: object
          additionalProperties: { type: string }
        endpointCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    ServicePortInput:
      type: object
      required: [port]
      properties:
        name: { type: string }
        protocol: { type: string, enum: [TCP, UDP, SCTP], default: TCP }
        port: { type: integer, minimum: 1, maximum: 65535 }
        targetPort:
          type: string
          description: Pod target port number or named container port.
    ServiceCreate:
      type: object
      required: [name, namespace, type, selector, ports]
      properties:
        name: { type: string }
        namespace: { type: string }
        type: { type: string, enum: [ClusterIP, NodePort, LoadBalancer] }
        headless:
          type: boolean
          default: false
          description: Create a Headless Service with clusterIP None. Requires type ClusterIP.
        selector:
          type: object
          additionalProperties: { type: string }
        ports:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/ServicePortInput" }
    ServiceUpdate:
      type: object
      required: [type, selector, ports]
      properties:
        type: { type: string, enum: [ClusterIP, NodePort, LoadBalancer] }
        headless:
          type: boolean
          default: false
          description: Must match the existing Service mode. Headless cannot be changed after creation.
        selector:
          type: object
          additionalProperties: { type: string }
        ports:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/ServicePortInput" }
        resourceVersion: { type: string }
    ServiceEndpoint:
      type: object
      required: [addresses, ready]
      properties:
        addresses:
          type: array
          items: { type: string }
        ready: { type: boolean }
        targetKind: { type: string }
        targetName: { type: string }
        targetNamespace: { type: string }
        nodeName: { type: string }
    ServiceDetail:
      allOf:
        - { $ref: "#/components/schemas/ServiceSummary" }
        - type: object
          required: [sessionAffinity, ipFamilies, endpoints]
          properties:
            labels:
              type: object
              additionalProperties: { type: string }
            annotations:
              type: object
              additionalProperties: { type: string }
            externalName: { type: string }
            sessionAffinity: { type: string }
            ipFamilies:
              type: array
              items: { type: string }
            ipFamilyPolicy: { type: string }
            loadBalancerClass: { type: string }
            endpoints:
              type: array
              items: { $ref: "#/components/schemas/ServiceEndpoint" }
    IngressPath:
      type: object
      required: [host, path, pathType, service, port, targetStatus]
      properties:
        host: { type: string }
        path: { type: string }
        pathType: { type: string }
        service: { type: string }
        port: { type: string }
        targetStatus:
          type: string
          enum: [Ready, NoReadyEndpoints, ServiceNotFound, PortNotFound, Unknown]
          description: Backend Service and ready Endpoint availability for this route.
    IngressSummary:
      type: object
      required: [name, namespace, class, paths, createdAt]
      properties:
        name: { type: string }
        namespace: { type: string }
        resourceVersion: { type: string }
        class: { type: string }
        paths:
          type: array
          items: { $ref: "#/components/schemas/IngressPath" }
        tlsHosts:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    IngressTLS:
      type: object
      required: [hosts]
      properties:
        hosts:
          type: array
          items: { type: string }
        secretName: { type: string }
    IngressDetail:
      allOf:
        - { $ref: "#/components/schemas/IngressSummary" }
        - type: object
          properties:
            labels:
              type: object
              additionalProperties: { type: string }
            annotations:
              type: object
              additionalProperties: { type: string }
            defaultBackend: { $ref: "#/components/schemas/IngressPath" }
            tls:
              type: array
              items: { $ref: "#/components/schemas/IngressTLS" }
    IngressPathInput:
      type: object
      required: [path, service, port]
      properties:
        host: { type: string }
        path: { type: string, pattern: '^/' }
        pathType: { type: string, enum: [Prefix, Exact, ImplementationSpecific], default: Prefix }
        service: { type: string }
        port:
          type: string
          description: Backend Service port number or named port.
    IngressCreate:
      type: object
      required: [name, namespace, paths]
      properties:
        name: { type: string }
        namespace: { type: string }
        class: { type: string }
        paths:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/IngressPathInput" }
        tls:
          type: array
          items: { $ref: "#/components/schemas/IngressTLS" }
        annotations:
          type: object
          additionalProperties: { type: string }
    IngressUpdate:
      type: object
      required: [paths]
      properties:
        class: { type: string }
        paths:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/IngressPathInput" }
        tls:
          type: array
          items: { $ref: "#/components/schemas/IngressTLS" }
        annotations:
          type: object
          additionalProperties: { type: string }
        resourceVersion: { type: string }
    ServiceList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ServiceSummary" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    IngressList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IngressSummary" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    IngressClassSummary:
      type: object
      required: [name, controller, default, createdAt]
      properties:
        name: { type: string }
        controller: { type: string }
        default: { type: boolean }
        createdAt: { type: string, format: date-time }
    IngressClassList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IngressClassSummary" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    ConfigMapSummary:
      type: object
      required: [name, namespace, keys, dataBytes, createdAt]
      properties:
        name: { type: string }
        namespace: { type: string }
        resourceVersion: { type: string }
        keys:
          type: array
          items: { type: string }
        dataBytes: { type: integer }
        createdAt: { type: string, format: date-time }
    ConfigMapDetail:
      allOf:
        - { $ref: "#/components/schemas/ConfigMapSummary" }
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: { type: string }
    ConfigMapCreate:
      type: object
      required: [name, namespace, data]
      properties:
        name: { type: string }
        namespace: { type: string }
        data:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
    ConfigMapUpdate:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        resourceVersion: { type: string }
    SecretKey:
      type: object
      required: [key, size]
      properties:
        key: { type: string }
        size: { type: integer }
    SecretSummary:
      type: object
      required: [name, namespace, type, keys, createdAt]
      properties:
        name: { type: string }
        namespace: { type: string }
        resourceVersion: { type: string }
        type: { type: string }
        keys:
          type: array
          items: { $ref: "#/components/schemas/SecretKey" }
        createdAt: { type: string, format: date-time }
    SecretReveal:
      allOf:
        - { $ref: "#/components/schemas/SecretSummary" }
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: { type: string, contentEncoding: base64 }
    SecretWrite:
      type: object
      required: [type, data]
      properties:
        name: { type: string }
        namespace: { type: string }
        type: { type: string, default: Opaque }
        data:
          type: object
          additionalProperties: { type: string, contentEncoding: base64 }
        annotations:
          type: object
          additionalProperties: { type: string }
        resourceVersion: { type: string }
    ConfigMapList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ConfigMapSummary" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    SecretList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SecretSummary" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    StorageClass:
      type: object
      required: [name, provisioner, reclaimPolicy, volumeBinding, allowVolumeExpansion, default, createdAt]
      properties:
        name: { type: string }
        resourceVersion: { type: string }
        provisioner: { type: string }
        reclaimPolicy: { type: string }
        volumeBinding: { type: string }
        allowVolumeExpansion: { type: boolean }
        default: { type: boolean }
        createdAt: { type: string, format: date-time }
    StorageClassDetail:
      allOf:
        - { $ref: "#/components/schemas/StorageClass" }
        - type: object
          required: [allowVolumeExpansion]
          properties:
            labels:
              type: object
              additionalProperties: { type: string }
            annotations:
              type: object
              additionalProperties: { type: string }
            parameters:
              type: object
              additionalProperties: { type: string }
            mountOptions:
              type: array
              items: { type: string }
            allowVolumeExpansion: { type: boolean }
    StorageClassWrite:
      type: object
      required: [provisioner, reclaimPolicy, volumeBinding, allowVolumeExpansion, default]
      properties:
        name: { type: string }

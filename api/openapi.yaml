      summary: Render a Helm upgrade preview using server-side current values
      description: >-
        Merges the supplied Values YAML as an override over the unredacted values
        stored in the current Helm revision, renders the stored chart, and returns
        server-redacted Values and Manifest diffs. This endpoint never mutates the
        cluster. Requires list Secrets permission in the release namespace.
      security:
        - cookieAuth: []
          csrfToken: []

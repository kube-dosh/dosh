{{- $authMode := include "dosh.authMode" . -}}
{{- $oidc := .Values.auth.oidc | default dict -}}
{{- $egress := .Values.egress | default dict -}}
{{- $egressProxy := $egress.proxy | default dict -}}
{{- $egressProxyCA := $egressProxy.ca | default dict -}}
{{- $networkPolicy := .Values.networkPolicy | default dict -}}
{{- $runtimePolicy := $networkPolicy.runtimeManagement | default dict -}}
{{- $runtimePolicyEnabled := $runtimePolicy.enabled | default false -}}
{{- $runtimePolicyName := $runtimePolicy.policyName | default (printf "%s-egress-runtime" (include "dosh.fullname" .)) -}}
{{- $updateCheck := .Values.updateCheck | default dict -}}
{{- $persistence := .Values.persistence | default dict -}}
{{- if and $persistence.enabled (not $persistence.existingClaim) -}}
{{- fail "persistence.existingClaim is required when persistence.enabled=true" -}}
{{- end -}}
{{- $proxyMode := $egressProxy.mode | default "environment" -}}
{{- if not (has $proxyMode (list "environment" "explicit" "direct")) -}}
{{- fail "egress.proxy.mode must be environment, explicit, or direct" -}}
{{- end -}}
{{- if and (eq $proxyMode "explicit") (not (or $egressProxy.httpProxy $egressProxy.httpsProxy)) -}}
{{- fail "egress.proxy.httpProxy or egress.proxy.httpsProxy is required when egress.proxy.mode=explicit" -}}
{{- end -}}
{{- if and (eq $proxyMode "explicit") .Values.networkPolicy.enabled (not (($.Values.networkPolicy.outboundProxy | default dict).ipBlocks)) -}}
{{- fail "networkPolicy.outboundProxy.ipBlocks is required when egress.proxy.mode=explicit and networkPolicy.enabled=true" -}}
{{- end -}}
{{- if and $runtimePolicyEnabled (not $networkPolicy.enabled) -}}
{{- fail "networkPolicy.runtimeManagement.enabled requires networkPolicy.enabled=true" -}}
{{- end -}}
{{- if $egressProxy.existingSecret -}}
{{- $_ := required "egress.proxy.usernameKey is required when egress.proxy.existingSecret is set" $egressProxy.usernameKey -}}
{{- $_ = required "egress.proxy.passwordKey is required when egress.proxy.existingSecret is set" $egressProxy.passwordKey -}}
{{- end -}}
{{- if and $updateCheck.enabled (not (hasPrefix "https://" ($updateCheck.url | default ""))) -}}
{{- fail "updateCheck.url must be an absolute https:// URL when updateCheck.enabled=true" -}}
{{- end -}}
{{- if and $updateCheck.enabled $updateCheck.existingSecret (not $updateCheck.tokenKey) -}}
{{- fail "updateCheck.tokenKey is required when updateCheck.existingSecret is set" -}}
{{- end -}}
{{- $imageDigest := .Values.image.digest | default "" -}}
{{- if .Values.tls.enabled -}}
{{- $_ := required "tls.existingSecret is required when tls.enabled=true" .Values.tls.existingSecret -}}
{{- $_ = required "tls.certFile is required when tls.enabled=true" .Values.tls.certFile -}}
{{- $_ = required "tls.keyFile is required when tls.enabled=true" .Values.tls.keyFile -}}
{{- end -}}
{{- if and $imageDigest (not (regexMatch "^sha256:[a-fA-F0-9]{64}$" $imageDigest)) -}}
{{- fail "image.digest must be sha256:<64 hex characters>" -}}
{{- end -}}
{{- if eq $authMode "oidc" -}}
{{- $issuer := required "auth.oidc.issuer is required when auth.mode=oidc" $oidc.issuer -}}
{{- if not (hasPrefix "https://" $issuer) -}}
{{- fail "auth.oidc.issuer must be an absolute https:// URL" -}}
{{- end -}}
{{- $redirectURL := required "auth.oidc.redirectURL is required when auth.mode=oidc" $oidc.redirectURL -}}
{{- if not (hasPrefix "https://" $redirectURL) -}}
{{- fail "auth.oidc.redirectURL must be an absolute https:// URL" -}}
{{- end -}}
{{- $_ := required "auth.oidc.clientID is required when auth.mode=oidc" $oidc.clientID -}}
{{- $_ = required "auth.oidc.existingSecret is required when auth.mode=oidc" $oidc.existingSecret -}}
{{- if not (has "openid" ($oidc.scopes | default (list "openid"))) -}}
{{- fail "auth.oidc.scopes must include openid" -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dosh.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dosh.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "dosh.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dosh.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ toYaml .Values | sha256sum }}
        {{- if .Values.tls.enabled }}
        checksum/tls-secret: {{ (lookup "v1" "Secret" .Release.Namespace .Values.tls.existingSecret).data | toYaml | sha256sum | quote }}
        {{- end }}
        checksum/auth-secret: {{ (lookup "v1" "Secret" .Release.Namespace .Values.auth.existingSecret).data | toYaml | sha256sum | quote }}
        {{- if and (eq $authMode "oidc") $oidc.ca.existingConfigMap }}
        checksum/oidc-ca: {{ (lookup "v1" "ConfigMap" .Release.Namespace $oidc.ca.existingConfigMap).data | toYaml | sha256sum | quote }}
        {{- end }}
        {{- if $egressProxy.existingSecret }}
        checksum/egress-proxy-secret: {{ (lookup "v1" "Secret" .Release.Namespace $egressProxy.existingSecret).data | toYaml | sha256sum | quote }}
        {{- end }}
        {{- if $egressProxyCA.existingConfigMap }}
        checksum/egress-proxy-ca: {{ (lookup "v1" "ConfigMap" .Release.Namespace $egressProxyCA.existingConfigMap).data | toYaml | sha256sum | quote }}
        {{- end }}
        {{- if and $updateCheck.enabled $updateCheck.existingSecret }}
        checksum/update-check-secret: {{ (lookup "v1" "Secret" .Release.Namespace $updateCheck.existingSecret).data | toYaml | sha256sum | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dosh.serviceAccountName" . }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.antiAffinity.required }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "dosh.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dosh
          image: "{{ if $imageDigest }}{{ .Values.image.repository }}@{{ $imageDigest }}{{ else }}{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: DOSH_LISTEN_ADDR
              value: ":{{ .Values.containerPort }}"
            - name: DOSH_TLS_ENABLED
              value: {{ .Values.tls.enabled | quote }}
            - name: DOSH_TLS_CERT_FILE
              value: {{ .Values.tls.certFile | quote }}
            - name: DOSH_TLS_KEY_FILE
              value: {{ .Values.tls.keyFile | quote }}
            - name: DOSH_TLS_RELOAD_INTERVAL
              value: {{ .Values.tls.reloadInterval | quote }}
            - name: DOSH_AUTH_MODE
              value: {{ $authMode | quote }}
            {{- if eq $authMode "local" }}
            - name: DOSH_ADMIN_USERNAME
              value: {{ .Values.auth.adminUsername | quote }}
            - name: DOSH_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.adminPasswordHashKey }}
            {{- else if eq $authMode "oidc" }}
            - name: DOSH_OIDC_ISSUER
              value: {{ required "auth.oidc.issuer is required when auth.mode=oidc" $oidc.issuer | quote }}
            - name: DOSH_OIDC_CLIENT_ID
              value: {{ required "auth.oidc.clientID is required when auth.mode=oidc" $oidc.clientID | quote }}
            - name: DOSH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.oidc.existingSecret is required when auth.mode=oidc" $oidc.existingSecret }}
                  key: {{ required "auth.oidc.clientSecretKey is required when auth.mode=oidc" $oidc.clientSecretKey }}
            - name: DOSH_OIDC_REDIRECT_URL
              value: {{ required "auth.oidc.redirectURL is required when auth.mode=oidc" $oidc.redirectURL | quote }}
            - name: DOSH_OIDC_SCOPES
              value: {{ join "," ($oidc.scopes | default (list "openid" "profile" "email" "groups")) | quote }}
            - name: DOSH_OIDC_USERNAME_CLAIM
              value: {{ default "email" $oidc.usernameClaim | quote }}
            - name: DOSH_OIDC_GROUPS_CLAIM
              value: {{ default "groups" $oidc.groupsClaim | quote }}
            - name: DOSH_OIDC_ADMIN_GROUPS
              value: {{ join "," ($oidc.adminGroups | default (list)) | quote }}
            - name: DOSH_OIDC_TIMEOUT
              value: {{ default "10s" $oidc.timeout | quote }}
            - name: DOSH_OIDC_STATE_TTL
              value: {{ default "10m" $oidc.stateTTL | quote }}
            {{- if $oidc.ca.existingConfigMap }}
            - name: DOSH_OIDC_CA_FILE
              value: /etc/dosh/oidc/ca.crt
            {{- end }}
            {{- else if eq $authMode "token" }}
            - name: DOSH_TOKEN_REVIEW_AUDIENCE
              value: {{ default "" .Values.auth.token.audience | quote }}
            {{- end }}
            {{- if or (eq $authMode "local") (eq $authMode "token") }}
            - name: DOSH_LOGIN_RATE_LIMIT_MODE
              value: "kubernetes"
            - name: DOSH_LOGIN_RATE_LIMIT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            - name: DOSH_PREFERENCES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if $persistence.enabled }}
            - name: DOSH_DATA_DIR
              value: {{ $persistence.mountPath | default "/var/lib/dosh" | quote }}
            {{- end }}
            - name: DOSH_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.sessionKeyKey }}
            - name: DOSH_SESSION_TTL
              value: {{ .Values.auth.sessionTTL | quote }}
            - name: DOSH_COOKIE_SECURE
              value: {{ .Values.auth.cookieSecure | quote }}
            - name: DOSH_CLUSTER_NAME
              value: {{ .Values.runtime.clusterName | quote }}
            - name: DOSH_CHART_VERSION
              value: {{ .Chart.Version | quote }}
            - name: DOSH_READ_ONLY
              value: {{ .Values.runtime.readOnly | quote }}
            - name: DOSH_LOG_LEVEL
              value: {{ .Values.runtime.logLevel | quote }}
            - name: DOSH_KUBE_QPS
              value: {{ .Values.runtime.kubeQPS | quote }}
            - name: DOSH_KUBE_BURST
              value: {{ .Values.runtime.kubeBurst | quote }}
            - name: DOSH_REQUEST_TIMEOUT
              value: {{ .Values.runtime.requestTimeout | quote }}
            - name: DOSH_MAX_REQUEST_BODY
              value: {{ .Values.runtime.maxRequestBody | int64 | quote }}
            - name: DOSH_TERMINAL_IDLE_TIMEOUT
              value: {{ .Values.terminal.idleTimeout | quote }}
            - name: DOSH_TERMINAL_MAX_DURATION
              value: {{ .Values.terminal.maxDuration | quote }}
            - name: DOSH_TERMINAL_MAX_SESSIONS_PER_USER
              value: {{ .Values.terminal.maxSessionsPerUser | quote }}
            - name: DOSH_TERMINAL_MAX_OUTPUT_BYTES_PER_SECOND
              value: {{ .Values.terminal.maxOutputBytesPerSecond | int64 | quote }}
            - name: DOSH_PORT_FORWARD_TTL
              value: {{ .Values.portForward.ttl | quote }}
            - name: DOSH_PORT_FORWARD_MAX_SESSIONS_PER_USER
              value: {{ .Values.portForward.maxSessionsPerUser | quote }}
            - name: DOSH_EGRESS_PROXY_MODE
              value: {{ $proxyMode | quote }}
            - name: DOSH_NETWORK_POLICY_ENABLED
              value: {{ $networkPolicy.enabled | default false | quote }}
            - name: DOSH_NETWORK_POLICY_RUNTIME_MANAGEMENT_ENABLED
              value: {{ $runtimePolicyEnabled | quote }}
            - name: DOSH_NETWORK_POLICY_RUNTIME_NAME
              value: {{ $runtimePolicyName | trunc 63 | trimSuffix "-" | quote }}
            - name: DOSH_NETWORK_POLICY_HELM_NAME
              value: {{ include "dosh.fullname" . | quote }}
            - name: DOSH_NETWORK_POLICY_POD_SELECTOR
              value: {{ printf "app.kubernetes.io/name=%s,app.kubernetes.io/instance=%s" (include "dosh.name" .) .Release.Name | quote }}
            {{- if eq $proxyMode "explicit" }}
            - name: DOSH_EGRESS_HTTP_PROXY
              value: {{ $egressProxy.httpProxy | default "" | quote }}
            - name: DOSH_EGRESS_HTTPS_PROXY
              value: {{ $egressProxy.httpsProxy | default "" | quote }}
            - name: DOSH_EGRESS_NO_PROXY
              value: {{ $egressProxy.noProxy | default "" | quote }}
            {{- end }}
            {{- if $egressProxy.existingSecret }}
            - name: DOSH_EGRESS_PROXY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $egressProxy.existingSecret }}
                  key: {{ $egressProxy.usernameKey }}
            - name: DOSH_EGRESS_PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $egressProxy.existingSecret }}
                  key: {{ $egressProxy.passwordKey }}
            {{- end }}
            {{- if $egressProxyCA.existingConfigMap }}
            - name: DOSH_EGRESS_PROXY_CA_FILE
              value: /etc/dosh/egress/ca.crt
            {{- end }}
            - name: DOSH_UPDATE_CHECK_ENABLED
              value: {{ $updateCheck.enabled | default false | quote }}
            - name: DOSH_UPDATE_CHECK_URL
              value: {{ $updateCheck.url | default "https://api.github.com/repos/kube-dosh/dosh/releases/latest" | quote }}
            - name: DOSH_UPDATE_CHECK_CHANNEL
              value: {{ $updateCheck.channel | default "stable" | quote }}
            - name: DOSH_UPDATE_CHECK_TIMEOUT
              value: {{ $updateCheck.timeout | default "10s" | quote }}
            - name: DOSH_UPDATE_CHECK_CACHE_TTL
              value: {{ $updateCheck.cacheTTL | default "6h" | quote }}
            {{- if and $updateCheck.enabled $updateCheck.existingSecret }}
            - name: DOSH_UPDATE_CHECK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $updateCheck.existingSecret }}
                  key: {{ $updateCheck.tokenKey }}
            {{- end }}
            {{- if .Values.audit.webhook.enabled }}
            {{- if and (not .Values.audit.webhook.tokenKey) (not .Values.audit.webhook.hmacKeyKey) }}
            {{- fail "audit.webhook.tokenKey or audit.webhook.hmacKeyKey is required" }}
            {{- end }}
            {{- $auditURL := required "audit.webhook.url is required when audit.webhook.enabled=true" .Values.audit.webhook.url }}
            {{- if not (hasPrefix "https://" $auditURL) }}
            {{- fail "audit.webhook.url must be an absolute https:// URL" }}
            {{- end }}
            - name: DOSH_AUDIT_WEBHOOK_URL
              value: {{ $auditURL | quote }}
            {{- if .Values.audit.webhook.tokenKey }}
            - name: DOSH_AUDIT_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "audit.webhook.existingSecret is required" .Values.audit.webhook.existingSecret }}
                  key: {{ .Values.audit.webhook.tokenKey }}
            {{- end }}
            {{- if .Values.audit.webhook.hmacKeyKey }}
            - name: DOSH_AUDIT_WEBHOOK_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "audit.webhook.existingSecret is required" .Values.audit.webhook.existingSecret }}
                  key: {{ .Values.audit.webhook.hmacKeyKey }}
            {{- end }}
            {{- if .Values.audit.webhook.ca.existingConfigMap }}
            - name: DOSH_AUDIT_WEBHOOK_CA_FILE
              value: /etc/dosh/audit/ca.crt
            {{- end }}
            - name: DOSH_AUDIT_WEBHOOK_TIMEOUT
              value: {{ .Values.audit.webhook.timeout | quote }}
            - name: DOSH_AUDIT_WEBHOOK_QUEUE_SIZE
              value: {{ .Values.audit.webhook.queueSize | quote }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: {{ include "dosh.tlsScheme" . }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: {{ include "dosh.tlsScheme" . }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: {{ include "dosh.tlsScheme" . }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $persistence.enabled }}
            - name: dosh-data
              mountPath: {{ $persistence.mountPath | default "/var/lib/dosh" }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/dosh/tls
              readOnly: true
            {{- end }}
            {{- if and (eq $authMode "oidc") $oidc.ca.existingConfigMap }}
            - name: oidc-ca
              mountPath: /etc/dosh/oidc
              readOnly: true
            {{- end }}
            {{- if and .Values.audit.webhook.enabled .Values.audit.webhook.ca.existingConfigMap }}
            - name: audit-ca
              mountPath: /etc/dosh/audit
              readOnly: true
            {{- end }}
            {{- if $egressProxyCA.existingConfigMap }}
            - name: egress-proxy-ca
              mountPath: /etc/dosh/egress
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        {{- if $persistence.enabled }}
        - name: dosh-data
          persistentVolumeClaim:
            claimName: {{ $persistence.existingClaim }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if and (eq $authMode "oidc") $oidc.ca.existingConfigMap }}
        - name: oidc-ca
          configMap:
            name: {{ $oidc.ca.existingConfigMap }}
            items:
              - key: {{ required "auth.oidc.ca.key is required when auth.oidc.ca.existingConfigMap is set" $oidc.ca.key }}
                path: ca.crt
            defaultMode: 0444
        {{- end }}
        {{- if and .Values.audit.webhook.enabled .Values.audit.webhook.ca.existingConfigMap }}
        - name: audit-ca
          configMap:
            name: {{ .Values.audit.webhook.ca.existingConfigMap }}
            items:
              - key: {{ required "audit.webhook.ca.key is required when audit.webhook.ca.existingConfigMap is set" .Values.audit.webhook.ca.key }}
                path: ca.crt
            defaultMode: 0444
        {{- end }}
        {{- if $egressProxyCA.existingConfigMap }}
        - name: egress-proxy-ca
          configMap:
            name: {{ $egressProxyCA.existingConfigMap }}
            items:
              - key: {{ required "egress.proxy.ca.key is required when egress.proxy.ca.existingConfigMap is set" $egressProxyCA.key }}
                path: ca.crt
            defaultMode: 0444
        {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}

{{- $networkPolicy := .Values.networkPolicy | default dict }}
{{- $cilium := $networkPolicy.ciliumApiServer | default dict }}
{{- $oidc := $networkPolicy.oidc | default dict }}
{{- $webhook := $networkPolicy.webhook | default dict }}
{{- $authMode := include "dosh.authMode" . }}
{{- $ciliumApiServer := or $cilium.enabled (and $cilium.autoDetect ($.Capabilities.APIVersions.Has "cilium.io/v2")) }}
{{- if and $.Values.audit.webhook.enabled (not $webhook.ipBlocks) }}
{{- fail "networkPolicy.webhook.ipBlocks is required when audit.webhook.enabled=true and networkPolicy.enabled=true" }}
{{- end }}
{{- if and $networkPolicy.enabled $ciliumApiServer }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "dosh.fullname" . }}-api-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dosh.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "dosh.selectorLabels" . | nindent 6 }}
  egress:
    - toEntities:
        - kube-apiserver
    {{- if and (eq $authMode "oidc") $oidc.ipBlocks }}
    - toCIDR:
        {{- range $oidc.ipBlocks }}
        - {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            {{- range ($oidc.ports | default (list 443)) }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
    {{- end }}
    {{- if $.Values.audit.webhook.enabled }}
    - toCIDR:
        {{- range $webhook.ipBlocks }}
        - {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            {{- range ($webhook.ports | default (list 443)) }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
    {{- end }}
{{- end }}

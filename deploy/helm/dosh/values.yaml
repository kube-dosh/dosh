nameOverride: dosh

replicaCount: 2

image:
  repository: ghcr.io/kube-dosh/dosh
  tag: "0.1.8"
  # 生产发布优先设置 sha256 digest；设置后忽略 tag。
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: NodePort
  port: 32626
  nodePort: 32626

containerPort: 32626

networkPolicy:
  enabled: true
  ingressPort: 32626
  ciliumApiServer:
    # Cilium CRD 存在时自动创建 CNP；失败场景可显式关闭 autoDetect。
    enabled: false
    autoDetect: true
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  apiServer:
    ipBlocks:
      - 0.0.0.0/0
    ports:
      - 443
      - 6443
      - 16443
  containerRegistries:
    # 镜像仓列表、Tag 和连接测试都从 Dosh Pod 发起。启用 NetworkPolicy 时，
    # 必须显式填写镜像仓的 CIDR；留空表示不放行任何镜像仓出口。
    ipBlocks: []
    ports:
      - 443
      - 5000
  outboundProxy:
    # 显式代理启用且 NetworkPolicy 开启时必须填写代理 CIDR，禁止使用 0.0.0.0/0 兜底。
    ipBlocks: []
    ports:
      - 3128
      - 8080
      - 8443
  runtimeManagement:
    # 开启后 Dosh 可在运行时按代理域名解析出的精确 IP/端口维护独立
    # NetworkPolicy，更换运行时代理后不再需要人工升级 Helm values。
    # 启动时由 egress.proxy.mode=explicit 指定的代理仍受 outboundProxy 约束。
    enabled: false
    # 留空时使用 <fullname>-egress-runtime。
    policyName: ""
  webhook:
    ipBlocks: []
    ports:
      - 443
  oidc:
    # OIDC 模式必须显式填写 IdP 出口 CIDR，避免使用 0.0.0.0/0。
    ipBlocks: []
    ports:
      - 443

serviceAccount:
  create: true
  name: dosh

rbac:
  create: true
  clusterRoleName: dosh
  # local 模式为单管理员控制台；开启后资源浏览器可只读浏览全部内置资源和 CRD。
  # Token/OIDC 模式始终使用用户自身 Kubernetes RBAC，不受此值影响。
  localReadAllResources: true

auth:
  mode: token
  existingSecret: dosh-auth
  adminPasswordHashKey: admin-password-hash
  sessionKeyKey: session-key
  adminUsername: admin
  sessionTTL: 8h
  cookieSecure: true
  oidc:
    issuer: ""
    clientID: ""
    clientSecretKey: client-secret
    existingSecret: dosh-oidc
    redirectURL: ""
    scopes:
      - openid
      - profile
      - email
      - groups
    usernameClaim: email
    groupsClaim: groups
    adminGroups: []
    timeout: 10s
    stateTTL: 10m
    ca:
      existingConfigMap: ""
      key: ca.crt
  token:
    # 可选。设置后 TokenReview 会校验该 audience，适合使用 projected SA Token。
    audience: ""

audit:
  webhook:
    enabled: false
    # 启用时必须为绝对 https:// URL；明文 HTTP 会在渲染阶段失败。
    url: ""
    existingSecret: dosh-audit
    tokenKey: ""
    hmacKeyKey: hmac-key
    ca:
      existingConfigMap: ""
      key: ca.crt
    timeout: 3s
    queueSize: 1024

tls:
  enabled: true
  existingSecret: dosh-tls
  certFile: /etc/dosh/tls/tls.crt
  keyFile: /etc/dosh/tls/tls.key
  # 挂载证书变化后自动热加载的轮询间隔；0 表示仅允许通过 API 手动重载。
  reloadInterval: 30s

runtime:
  clusterName: kubedo-lab
  readOnly: false
  logLevel: info
  kubeQPS: 50
  kubeBurst: 100
  requestTimeout: 15s
  maxRequestBody: 2097152

persistence:
  # Optional shared volume mounted into the Dosh container. When enabled, the
  # mount path is also exported as DOSH_DATA_DIR and stores durable caches such
  # as Helm repository index.yaml and Chart packages. Use a ReadWriteMany claim
  # when replicas > 1.
  enabled: true
  existingClaim: dosh-data
  mountPath: /var/lib/dosh

egress:
  proxy:
    # environment: 使用 HTTP_PROXY/HTTPS_PROXY/NO_PROXY；explicit: 使用以下字段；direct: 强制直连。
    mode: environment
    httpProxy: ""
    httpsProxy: ""
    noProxy: ""
    # 可选。代理认证必须通过 Secret 注入，URL 中禁止携带用户名或密码。
    existingSecret: ""
    usernameKey: username
    passwordKey: password
    ca:
      existingConfigMap: ""
      key: ca.crt

updateCheck:
  # 默认关闭，避免隔离环境产生非预期外部请求。启用时应配置出站代理或放行更新源。
  enabled: false
  url: https://api.github.com/repos/kube-dosh/dosh/releases/latest
  channel: stable
  timeout: 10s
  cacheTTL: 6h
  # 私有发布源或需要提高 GitHub API 限额时配置。Token 只通过 Secret 注入。
  existingSecret: ""
  tokenKey: token

terminal:
  idleTimeout: 15m
  maxDuration: 2h
  maxSessionsPerUser: 4
  # 每个终端会话每秒最多发送给浏览器的输出字节数，防止无界命令输出拖垮服务。
  maxOutputBytesPerSecond: 2097152

portForward:
  # 浏览器访问的临时 HTTP 隧道只监听容器回环地址，并自动过期。
  ttl: 30m
  maxSessionsPerUser: 4

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    # 大型 Helm 仓库索引（例如 Bitnami 约 27 MiB）解析峰值约 550 MiB。
    memory: 1Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

antiAffinity:
  required: true

probes:
  startup:
    periodSeconds: 2
    failureThreshold: 30
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3

podAnnotations: {}
podLabels: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

priorityClassName: ""
nodeSelector: {}
tolerations: []
topologySpreadConstraints: []

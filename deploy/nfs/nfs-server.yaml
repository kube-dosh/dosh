apiVersion: v1
kind: Namespace
metadata:
  name: dosh-storage
  labels:
    app.kubernetes.io/managed-by: dosh
    dosh.io/component: nfs
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dosh-nfs
  namespace: dosh-storage
  labels:
    app.kubernetes.io/name: dosh-nfs
    app.kubernetes.io/managed-by: dosh
spec:
  serviceName: dosh-nfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dosh-nfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dosh-nfs
        app.kubernetes.io/managed-by: dosh
    spec:
      # NFSv4 uses a stable node address in the PV and must not float between
      # nodes. This lab deployment pins the server to worker-0001.
      nodeName: worker-0001
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: nfs
          image: 192.168.122.10:5000/dosh/nfs-ganesha:fedora44
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: NFS_EXPORT_DIR
              value: /export
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2049"]
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2049"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /export
      volumes:
        - name: data
          hostPath:
            path: /srv/dosh-nfs
            type: DirectoryOrCreate

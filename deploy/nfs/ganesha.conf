NFS_CORE_PARAM {
  Protocols = 4;
  NFS_Port = 2049;
  Bind_addr = 0.0.0.0;
  Allow_Numeric_Owners = true;
  Only_Numeric_Owners = true;
}

EXPORT {
  Export_Id = 1;
  Path = /export;
  Pseudo = /;
  Access_Type = RW;
  Squash = No_Root_Squash;
  SecType = "sys";
  FSAL { Name = VFS; }
}

LOG {
  Default_Log_Level = WARN;
}

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.7"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: dosh-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.10"
  NODE_VERSION: "24"
  HELM_VERSION: "3.22.0"

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/dosh
          CHART_OCI_REPOSITORY: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: bash scripts/release-github.sh

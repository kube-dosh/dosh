name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.5"
        required: true

concurrency:
  group: dosh-release
  cancel-in-progress: false

env:
  NODE_VERSION: "24.18.0"
  HELM_VERSION: "3.22.0"
  KO_VERSION: "0.19.1"

jobs:
  release:
    runs-on: docker
    timeout-minutes: 90
    container:
      image: golang:1.26.10-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install release toolchain
        run: |
          set -Eeuo pipefail

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            jq \
            ripgrep \
            xz-utils

          case "$(uname -m)" in
            x86_64)
              node_arch=x64
              helm_arch=amd64
              ko_arch=x86_64
              ;;
            aarch64|arm64)
              node_arch=arm64
              helm_arch=arm64
              ko_arch=arm64
              ;;
            *)
              printf 'unsupported runner architecture: %s\n' "$(uname -m)" >&2
              exit 1
              ;;
          esac

          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT

          node_archive="node-v${NODE_VERSION}-linux-${node_arch}.tar.xz"
          curl -fsSL --retry 3 -o "${workdir}/${node_archive}" \
            "https://nodejs.org/dist/v${NODE_VERSION}/${node_archive}"
          curl -fsSL --retry 3 -o "${workdir}/SHASUMS256.txt" \
            "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          (cd "$workdir" && grep " ${node_archive}$" SHASUMS256.txt | sha256sum -c -)
          tar -xJf "${workdir}/${node_archive}" -C /usr/local --strip-components=1

          helm_archive="helm-v${HELM_VERSION}-linux-${helm_arch}.tar.gz"
          curl -fsSL --retry 3 -o "${workdir}/${helm_archive}" \
            "https://get.helm.sh/${helm_archive}"
          curl -fsSL --retry 3 -o "${workdir}/${helm_archive}.sha256sum" \
            "https://get.helm.sh/${helm_archive}.sha256sum"
          (cd "$workdir" && sha256sum -c "${helm_archive}.sha256sum")
          tar -xzf "${workdir}/${helm_archive}" -C "$workdir"
          install -m 0755 "${workdir}/linux-${helm_arch}/helm" /usr/local/bin/helm

          ko_archive="ko_${KO_VERSION}_Linux_${ko_arch}.tar.gz"
          curl -fsSL --retry 3 -o "${workdir}/${ko_archive}" \
            "https://github.com/ko-build/ko/releases/download/v${KO_VERSION}/${ko_archive}"
          curl -fsSL --retry 3 -o "${workdir}/ko-checksums.txt" \
            "https://github.com/ko-build/ko/releases/download/v${KO_VERSION}/checksums.txt"
          (cd "$workdir" && grep " ${ko_archive}$" ko-checksums.txt | sha256sum -c -)
          tar -xzf "${workdir}/${ko_archive}" -C "$workdir"
          install -m 0755 "${workdir}/ko" /usr/local/bin/ko

          go version
          node --version
          npm --version
          helm version --short
          ko version

      - name: Build and publish release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
          RELEASE_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: bash scripts/release-codeberg.sh

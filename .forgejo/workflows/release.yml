name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.5"
        required: true

concurrency:
  group: dosh-release
  cancel-in-progress: false

env:
  HELM_VERSION: "3.22.0"
  KO_VERSION: "0.19.1"

jobs:
  web:
    name: Build web assets
    runs-on: codeberg-medium
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: https://code.forgejo.org/actions/setup-node@v7
        with:
          node-version: "24.18.0"

      - name: Build frontend
        run: |
          set -Eeuo pipefail
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build

      - name: Upload web assets
        uses: https://code.forgejo.org/actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 2

  artifacts:
    name: Build Linux artifacts
    needs: web
    runs-on: codeberg-medium
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: https://code.forgejo.org/actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download web assets
        uses: https://code.forgejo.org/actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Install Helm
        env:
          HELM_VERSION: ${{ env.HELM_VERSION }}
        run: bash scripts/install-codeberg-release-tool.sh helm

      - name: Build binaries and Helm chart
        env:
          RELEASE_STAGE: artifacts
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: PATH="${HOME}/.local/bin:${PATH}" bash scripts/release-codeberg.sh

      - name: Upload release artifacts
        uses: https://code.forgejo.org/actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist
          if-no-files-found: error
          retention-days: 2

  image:
    name: Publish multi-arch image
    needs: web
    runs-on: codeberg-medium
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: https://code.forgejo.org/actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download web assets
        uses: https://code.forgejo.org/actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Install ko
        env:
          KO_VERSION: ${{ env.KO_VERSION }}
        run: bash scripts/install-codeberg-release-tool.sh ko

      - name: Build and push image
        env:
          RELEASE_STAGE: image
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
          RELEASE_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_REGISTRY_USER: ${{ vars.CODEBERG_REGISTRY_USER }}
        run: PATH="${HOME}/.local/bin:${PATH}" bash scripts/release-codeberg.sh

      - name: Upload image metadata
        uses: https://code.forgejo.org/actions/upload-artifact@v7
        with:
          name: container-image
          path: dist/container-image.txt
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish Codeberg release
    needs:
      - artifacts
      - image
    runs-on: codeberg-small
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release artifacts
        uses: https://code.forgejo.org/actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist

      - name: Download image metadata
        uses: https://code.forgejo.org/actions/download-artifact@v8
        with:
          name: container-image
          path: dist

      - name: Publish release and Helm chart
        env:
          RELEASE_STAGE: publish
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
          RELEASE_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_REGISTRY_USER: ${{ vars.CODEBERG_REGISTRY_USER }}
        run: bash scripts/release-codeberg.sh
